# Al publicar un release en GitHub, agrega los archivos para instalar brain en Windows y Linux:
# - brain-setup.exe: instalador de Windows (corre install.ps1; ver installers/windows/brain_setup.py).
# - brain-install-linux.sh: el instalador de Linux/macOS, para bajar y correr con `bash`.
# - brain-<versión>-src.tar.gz: el código de ese release.
# - La app de escritorio (apps/desktop, Tauri): .dmg (macOS universal), .AppImage y .deb (Linux), setup.exe (Windows).
#   Los instaladores (install.sh / install.ps1) la bajan de acá.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del release (ej. v0.02.9)"
        required: true

permissions:
  contents: write

jobs:
  desktop:
    name: App de escritorio (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles appimage,deb
          - name: windows-x64
            os: windows-latest
            args: --bundles nsis
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Instalar la CLI de Tauri
        run: cargo install tauri-cli --version "^2" --locked
      - name: Armar los instaladores
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build ${{ matrix.args }}
      - name: Subir al release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          B=apps/desktop/src-tauri/target
          files=($B/release/bundle/dmg/*.dmg $B/universal-apple-darwin/release/bundle/dmg/*.dmg \
                 $B/release/bundle/appimage/*.AppImage $B/release/bundle/deb/*.deb \
                 $B/release/bundle/nsis/*-setup.exe)
          [ ${#files[@]} -gt 0 ] || { echo "no se armó ningún instalador"; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber

  windows:
    name: brain-setup.exe
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Armar el .exe
        shell: pwsh
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name brain-setup --add-data "install.ps1;." installers/windows/brain_setup.py
      - name: Subir al release
        shell: pwsh
        run: gh release upload $env:TAG dist/brain-setup.exe --clobber

  linux:
    name: Instalador de Linux y código
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Armar los archivos
        run: |
          cp install.sh brain-install-linux.sh
          chmod +x brain-install-linux.sh
          git archive --format=tar.gz --prefix=brain/ -o "brain-${TAG}-src.tar.gz" HEAD
      - name: Subir al release
        run: gh release upload "$TAG" brain-install-linux.sh "brain-${TAG}-src.tar.gz" --clobber
