<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brain · chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Courier+Prime:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="/ui.js"></script>
<style>
  /* Chat: mismo sistema monocromo que el dashboard (DESIGN.md), en versión conversación.
     Una sola superficie, sin paneles grises; los bloques se separan con aire y líneas finas.
     Forma: controles en píldora, contenedores (burbujas, compositor, trazas) con radio 14-22 px. */
  :root {
    color-scheme: light;
    --bg: #ffffff; --soft: #f3f3f1; --softer: #f8f8f6; --line: #e6e6e3; --line-strong: #cfcfcc;
    --text: #0a0a0a; --text-2: #3d3d3d; --text-3: #6b6b67; --bad: #b42318; --bad-soft: #fbeae8;
    --shadow: 0 1px 2px rgba(10,10,10,.05), 0 8px 28px -12px rgba(10,10,10,.18);
    --bui-radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #191918; --soft: #252524; --softer: #1f1f1e; --line: #2a2a29; --line-strong: #3a3a38;
      --text: #f2f2f0; --text-2: #c8c8c4; --text-3: #9a9a95; --bad: #f07167; --bad-soft: #3a1d1a;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #191918; --soft: #252524; --softer: #1f1f1e; --line: #2a2a29; --line-strong: #3a3a38;
    --text: #f2f2f0; --text-2: #c8c8c4; --text-3: #9a9a95; --bad: #f07167; --bad-soft: #3a1d1a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 400 15px/1.6 "Archivo", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .mono { font-family: "Courier Prime", "Courier New", monospace; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  ::selection { background: var(--text); color: var(--bg); }
  [hidden] { display: none !important; }
  svg { flex: none; }

  .app { display: grid; grid-template-columns: 256px 1fr; height: 100vh; height: 100dvh; }

  /* ---------- historial ---------- */
  .hist { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
  .hist-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 18px 14px 8px 18px; }
  .label { margin: 0; font: 700 11.5px/1.2 "Courier Prime", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
  .search { margin: 6px 12px 8px; border: 0; background: var(--soft); border-radius: 999px; padding: 8px 14px; outline: none; font-size: 13.5px; }
  .search:focus-visible { outline: 2px solid var(--text); outline-offset: 0; }
  .hist-list { list-style: none; margin: 0; padding: 2px 8px 16px; overflow: auto; flex: 1; }
  .hist-list li { position: relative; border-radius: 12px; }
  .hist-list li + li { margin-top: 2px; }
  .hist-list button.open { width: 100%; text-align: left; border: 0; background: none; padding: 8px 34px 8px 10px; cursor: pointer; border-radius: 12px; display: block; }
  .hist-list b { display: block; font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-list span { font: 400 11.5px/1.3 "Courier Prime", monospace; color: var(--text-3); }
  .hist-list li:hover { background: var(--softer); }
  .hist-list li.on { background: var(--soft); }
  .hist-empty { padding: 10px 12px; font-size: 13px; color: var(--text-3); }
  .x { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--text-3);
    cursor: pointer; width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center; opacity: 0; }
  .x svg { width: 13px; height: 13px; }
  .hist-list li:hover .x, .hist-list li.on .x, .x:focus-visible { opacity: 1; }
  .x:hover { color: var(--bad); background: var(--bad-soft); }

  /* ---------- barra ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 14px 20px 10px; }
  .bar .title { font-weight: 650; font-size: 15px; letter-spacing: -.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 7px; height: 34px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
    padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: border-color .15s, background .15s; }
  .pill:hover { border-color: var(--line-strong); background: var(--softer); }
  .pill:active { transform: translateY(1px); }
  .pill.dark { background: var(--text); color: var(--bg); border-color: var(--text); }
  .pill.dark:hover { opacity: .88; }
  .pill.icon { width: 34px; padding: 0; justify-content: center; }
  .pill svg { width: 16px; height: 16px; }
  .pill.bui-dd-btn, .model-tag { font: 400 12.5px/1 "Courier Prime", monospace; max-width: 230px; }
  .model-tag { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--soft);
    color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .model-tag svg { width: 13px; height: 13px; color: var(--text-3); }
  /* título del chat, editable con el lápiz */
  .title-wrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; }
  .bar .title-wrap .title { flex: 0 1 auto; }
  .ghost { border-color: transparent; background: none; color: var(--text-3); width: 30px; height: 30px; }
  .ghost:hover { color: var(--text); border-color: var(--line); }
  .ghost svg { width: 14px; height: 14px; }
  .title-input { flex: 1; min-width: 0; height: 34px; border: 1px solid var(--text-3); border-radius: 999px; padding: 0 14px; background: var(--bg);
    font-weight: 650; font-size: 15px; outline: none; }

  /* ---------- mensajes ---------- */
  .msgs { flex: 1; overflow: auto; padding: 8px 20px 24px; scroll-behavior: smooth; }
  .col { max-width: 740px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  .msg.user { align-self: flex-end; max-width: 82%; background: var(--soft); border-radius: 20px 20px 6px 20px; padding: 10px 16px;
    white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.assistant { align-self: stretch; }
  .who { display: flex; align-items: center; gap: 8px; font: 700 11.5px/1 "Courier Prime", monospace; letter-spacing: .08em;
    text-transform: uppercase; color: var(--text-2); margin-bottom: 8px; }
  .who svg { width: 20px; height: 20px; }
  .body { overflow-wrap: anywhere; }
  .body p { margin: 0 0 .75em; } .body p:last-child { margin-bottom: 0; }
  .body pre { background: var(--softer); border: 1px solid var(--line); padding: 12px 14px; border-radius: 14px; overflow-x: auto; font-size: 13px; }
  .body code { font-family: "Courier Prime", monospace; font-size: .95em; }
  .body :not(pre) > code { background: var(--soft); padding: 1px 6px; border-radius: 6px; }
  .body a { color: var(--text); text-underline-offset: 3px; }
  .body ul, .body ol { padding-left: 1.3em; margin: 0 0 .75em; }
  .body h1, .body h2, .body h3 { font-size: 1.05em; margin: 1em 0 .4em; }
  .body table { border-collapse: collapse; font-size: 14px; } .body td, .body th { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .cursor::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 4px; border-radius: 999px; background: var(--text); vertical-align: middle; animation: breathe 1.1s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .25; transform: scale(.7); } }

  /* traza de tools: todas las llamadas, cada una desplegable con argumentos y resultado */
  .trace { margin: 0 0 12px; border-left: 2px solid var(--line); padding-left: 12px; display: grid; gap: 4px; }
  .trace-h { font: 700 11px/1.4 "Courier Prime", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  .call { border-radius: 12px; }
  .call summary { list-style: none; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 5px 8px; border-radius: 10px;
    font: 400 13px/1.35 "Courier Prime", monospace; color: var(--text-2); }
  .call summary::-webkit-details-marker { display: none; }
  .call summary:hover { background: var(--softer); }
  .call summary b { color: var(--text); font-weight: 700; }
  .call summary .args { color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .call summary .chev { width: 12px; height: 12px; color: var(--text-3); transition: transform .15s; }
  .call[open] summary .chev { transform: rotate(90deg); }
  .call .st { width: 16px; height: 16px; border-radius: 999px; display: grid; place-items: center; flex: none; }
  .call .st svg { width: 10px; height: 10px; }
  .call.ok .st { background: var(--text); color: var(--bg); }
  .call.err .st { background: var(--bad); color: #fff; }
  .call.err summary b { color: var(--bad); }
  .call-b { margin: 2px 0 8px 32px; display: grid; gap: 6px; }
  .call-b .k { font: 700 10.5px/1 "Courier Prime", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  .call-b pre { margin: 0; background: var(--softer); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; font: 12.5px/1.5 "Courier Prime", monospace;
    white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; color: var(--text-2); }
  .spin { width: 10px; height: 10px; border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .note { font-size: 13px; color: var(--text-3); margin-top: 8px; }
  .note.err { color: var(--bad); }

  .empty { min-height: 58vh; display: flex; flex-direction: column; justify-content: center; padding: 20px 0; }
  .empty h1 { font: 800 clamp(28px, 4vw, 40px)/1.05 "Archivo", sans-serif; font-stretch: 84%; letter-spacing: -.03em; margin: 0 0 10px; }
  .empty p { color: var(--text-2); margin: 0 0 22px; max-width: 52ch; }
  .sugs { display: flex; flex-wrap: wrap; gap: 8px; }
  .sugs .pill { font-weight: 500; }

  .banner { max-width: 740px; margin: 0 auto 10px; width: calc(100% - 40px); padding: 10px 14px; border-radius: 14px; background: var(--softer);
    border: 1px solid var(--line); font-size: 13.5px; color: var(--text-2); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .banner.err { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
  .banner code { font-family: "Courier Prime", monospace; }

  /* ---------- compositor ---------- */
  form.composer { padding: 0 20px 16px; }
  .comp { max-width: 740px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; background: var(--bg); border: 1px solid var(--line-strong);
    border-radius: 24px; padding: 8px 8px 8px 18px; box-shadow: var(--shadow); transition: border-color .15s; }
  .comp:focus-within { border-color: var(--text-3); }
  .comp textarea { flex: 1; resize: none; border: 0; outline: none; background: none; min-height: 40px; max-height: 200px; line-height: 1.5; padding: 8px 0; }
  .send { width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--text); color: var(--bg); display: grid; place-items: center; cursor: pointer; flex: none; transition: opacity .15s, transform .1s; }
  .send:hover { opacity: .85; } .send:active { transform: scale(.96); }
  .send:disabled { opacity: .3; cursor: default; }
  .send svg { width: 18px; height: 18px; }
  /* uso de la ventana de contexto: una "O" que se va llenando */
  .ctx { position: relative; width: 40px; height: 40px; border: 0; background: none; padding: 0; display: grid; place-items: center; flex: none; cursor: help; color: var(--text); }
  .ctx svg { width: 22px; height: 22px; transform: rotate(-90deg); }
  .ctx .track { stroke: var(--line-strong); }
  .ctx .fill { stroke: currentColor; transition: stroke-dashoffset .35s ease; }
  .ctx.full { color: var(--bad); }
  .ctx .tipbox { white-space: pre-line; position: absolute; bottom: calc(100% + 10px); right: -6px; width: max-content; max-width: 260px; background: var(--text); color: var(--bg);
    font: 400 12px/1.45 "Courier Prime", monospace; padding: 8px 10px; border-radius: 10px; text-align: left; pointer-events: none;
    opacity: 0; transform: translateY(3px); transition: opacity .12s, transform .12s; z-index: 4; }
  .ctx:hover .tipbox, .ctx:focus-visible .tipbox, .ctx.show .tipbox { opacity: 1; transform: none; }
  /* comandos: al escribir "/" aparece la lista arriba del compositor */
  form.composer { position: relative; }
  .cmds { position: absolute; left: 20px; right: 20px; bottom: calc(100% - 6px); max-width: 740px; margin: 0 auto; list-style: none; padding: 6px;
    background: var(--bg); border: 1px solid var(--line-strong); border-radius: 18px; box-shadow: var(--shadow); z-index: 3; }
  .cmds li { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: baseline; padding: 9px 12px; border-radius: 12px; cursor: pointer; }
  .cmds li.on { background: var(--soft); }
  .cmds b { font: 700 13.5px/1.3 "Courier Prime", monospace; }
  .cmds span { font-size: 13.5px; color: var(--text-2); }
  .cmds .cmds-h { display: block; padding: 4px 12px 6px; font: 700 10.5px/1 "Courier Prime", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); cursor: default; }
  .pop .cmds, .narrow .cmds { left: 10px; right: 10px; }
  .narrow .cmds li, .pop .cmds li { grid-template-columns: 1fr; }
  .msg.compact { border: 1px dashed var(--line-strong); border-radius: 16px; padding: 12px 16px; background: var(--softer); }
  .compact-h { font: 700 11px/1.3 "Courier Prime", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
  .cmd-chip { display: inline-block; font: 700 12px/1.6 "Courier Prime", monospace; background: var(--text); color: var(--bg); border-radius: 999px; padding: 0 8px; margin-right: 6px; }
  .hint { max-width: 740px; margin: 8px auto 0; font: 400 11.5px/1.3 "Courier Prime", monospace; color: var(--text-3); text-align: center; }

  /* ventana flotante y pantallas angostas: el historial se abre como panel */
  .pop .app, .narrow .app { grid-template-columns: 1fr; }
  .pop .hist, .narrow .hist { position: fixed; inset: 0 auto 0 0; width: min(290px, 86vw); z-index: 5; box-shadow: var(--shadow); display: none; }
  .pop.hist-open .hist, .narrow.hist-open .hist { display: flex; }
  .pop .msgs, .narrow .msgs { padding: 4px 14px 18px; }
  .pop .bar, .narrow .bar { padding: 10px 12px 6px; }
  .pop form.composer, .narrow form.composer { padding: 0 10px 10px; }
  .pop .hint { display: none; }
  .pop .banner, .narrow .banner { width: calc(100% - 24px); }
  #hist-btn, #new-btn-2 { display: none; }
  .pop #hist-btn, .narrow #hist-btn, .pop #new-btn-2, .narrow #new-btn-2 { display: inline-flex; }
  .narrow #pop-label { display: none; }
  @media (prefers-reduced-motion: reduce) { .cursor::after, .spin { animation: none; } .msgs { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="app">
  <aside class="hist" id="hist">
    <div class="hist-h"><h2 class="label" id="t-chats"></h2><button class="pill icon" id="new-btn" type="button"></button></div>
    <input class="search" id="hist-q" type="search">
    <ul class="hist-list" id="hist-list"></ul>
  </aside>
  <section class="main">
    <div class="bar">
      <button class="pill icon" id="hist-btn" type="button"></button>
      <div class="title-wrap"><div class="title" id="title"></div><button class="pill icon ghost" id="rename-btn" type="button" hidden></button></div>
      <select class="pill" id="model"></select>
      <span class="model-tag" id="model-tag" hidden></span>
      <button class="pill icon" id="new-btn-2" type="button"></button>
      <button class="pill" id="pop-btn" type="button"></button>
    </div>
    <div id="banner"></div>
    <div class="msgs" id="msgs" aria-live="polite"><div class="col" id="col"></div></div>
    <form class="composer" id="composer">
      <ul class="cmds" id="cmds" role="listbox" hidden></ul>
      <div class="comp">
        <textarea id="text" rows="1" aria-autocomplete="list" aria-controls="cmds"></textarea>
        <button class="ctx" id="ctx" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="track" cx="12" cy="12" r="9" fill="none" stroke-width="2.6"/><circle class="fill" cx="12" cy="12" r="9" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="56.55" stroke-dashoffset="56.55"/></svg><span class="tipbox" id="ctx-tip"></span></button>
        <button class="send" id="send" type="submit"></button>
      </div>
      <div class="hint" id="hint"></div>
    </form>
  </section>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const params = new URLSearchParams(location.search);
const MODE = params.get("mode") || (window.top !== window ? "embed" : "tab");  // embed (dashboard) · pop (flotante) · tab
if (MODE === "pop") document.body.classList.add("pop");

const I18N = {
  es: {
    chats: "Chats", newTitle: "Chat nuevo", search: "Buscar chats", noChats: "Todavía no hay chats guardados.",
    brain: "brain", send: "Enviar", stop: "Parar", ph: "Preguntá, pedí que guarde algo o que edite una nota", phShort: "Escribí un mensaje",
    hint: "Enter envía · Shift+Enter salto de línea · / comandos",
    pop: "Flotante", popTitle: "Abrir el chat en una ventana flotante, siempre visible", hist: "Historial",
    emptyT: "Hablá con tu memoria", emptyP: "Corre en tu máquina con Ollama. Conoce tu perfil y tu memoria, y puede buscar, guardar y editar notas del vault por vos.",
    sugs: ["¿Qué sabés de mí?", "Resumí mis proyectos", "Guardá que prefiero respuestas cortas", "¿Qué fuentes guardé últimamente?"],
    noOllama: "Ollama no está corriendo. Prendelo desde el Panel del dashboard.", noModels: "No hay ningún modelo de chat en Ollama.",
    pull: m => `Descargar ${m}`, pulling: m => `Descargando ${m}… puede tardar unos minutos.`, pullCmd: "o en la terminal:",
    noHistory: "Chroma está apagado: el chat funciona, pero no se guarda en el historial.",
    notSaved: "No se pudo guardar en el historial (¿Chroma apagado?).",
    textTools: "Este modelo no acepta tools nativas: se las paso como texto, así igual puede leer y editar el vault.",
    maxRounds: "Se cortó después de varias acciones seguidas.", delConfirm: "¿Borrar este chat del historial?", del: "Borrar chat",
    actions: n => n === 1 ? "1 acción" : `${n} acciones`, args: "Argumentos", result: "Resultado", running: "ejecutando…",
    err: { ollama: "Ollama no está corriendo. Prendelo desde el Panel.", no_model: "Elegí un modelo instalado.", empty: "Escribí un mensaje.",
      chroma: "Chroma no está corriendo.", not_found: "Ese chat ya no existe.", nothing_to_compact: "Todavía no hay nada que compactar en este chat.", other: "Error" },
    ago: (n, u) => new Intl.RelativeTimeFormat("es", { numeric: "auto" }).format(-n, u), model: "Modelo",
    cancel: "Cancelar", delOk: "Borrar", rename: "Cambiar el título", renameErr: "No se pudo cambiar el título",
    modelLocked: m => `Este chat usa ${m}. Para otro modelo, empezá un chat nuevo.`,
    modelMissing: m => `${m} ya no está instalado: elegí otro modelo para seguir este chat.`,
    ctxTip: (u, c, mx) => `Contexto: ${num(u)} de ${num(c)} tokens (${Math.round(u / c * 100)}%)` + (mx > c ? `\nEl modelo soporta ${num(mx)}; brain usa ${num(c)}.` : ""),
    ctxFull: "Casi lleno: el modelo empieza a olvidar lo primero del chat. Conviene uno nuevo.",
    ctxNone: "Contexto: se calcula al enviar el primer mensaje.",
    cmdsTitle: "Comandos",
    cmds: { organize: "Ordenar el vault y el grafo (carpetas, tags, relaciones, duplicados). Pregunta antes de mover nada.",
      reflect: "Revisar la memoria: duplicados, contradicciones y notas sin entidades.", new: "Empezar un chat nuevo.",
      compact: "Compactar la sesión: resume lo hablado para liberar contexto y seguir en este chat." },
    compacted: "Conversación compactada · el modelo sigue desde este resumen", nothingToCompact: "Todavía no hay nada que compactar en este chat.",
  },
  en: {
    chats: "Chats", newTitle: "New chat", search: "Search chats", noChats: "No saved chats yet.",
    brain: "brain", send: "Send", stop: "Stop", ph: "Ask, or have it save something or edit a note", phShort: "Write a message",
    hint: "Enter sends · Shift+Enter new line · / commands",
    pop: "Float", popTitle: "Open the chat in a floating window that stays on top", hist: "History",
    emptyT: "Talk to your memory", emptyP: "Runs on your machine with Ollama. It knows your profile and memory, and can search, save and edit vault notes for you.",
    sugs: ["What do you know about me?", "Summarize my projects", "Remember that I prefer short answers", "What sources did I save lately?"],
    noOllama: "Ollama isn't running. Turn it on from the dashboard.", noModels: "There's no chat model in Ollama.",

const I = (d, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;

};

// ================= estado =================
let chats = [], current = null, messages = [], busy = false, controller = null, historyOk = true, models = [];
let chatModel = "";                 // modelo con el que arrancó el chat abierto (queda fijo)
let usage = { tokens: 0, ctx: 0, max: 0 };  // ventana de contexto del chat abierto
const COMMANDS = ["organize", "compact", "reflect", "new"];

async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-Brain": "1" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({ ok: false, code: "other", detail: `HTTP ${r.status}` }));
  if (!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
const errText = r => (T.err[r.code] || T.err.other) + (["other", "ollama_http", "pull_failed"].includes(r.code) ? ` ${r.detail || ""}` : "");
function md(text) {

}
function ago(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return T.ago(0, "second");
  if (s < 3600) return T.ago(Math.round(s / 60), "minute");
  if (s < 86400) return T.ago(Math.round(s / 3600), "hour");
  return T.ago(Math.round(s / 86400), "day");
}

// ================= modelos =================
async function loadModels() {
  const sel = $("#model");
  let r;
  try { r = await api("/api/chat/models"); } catch (e) { r = { ok: false, code: "other", detail: e.message }; }
  if (!r.ok) { models = []; sel.innerHTML = ""; sel.hidden = true; banner(r.code === "ollama" ? T.noOllama : errText(r), true); return; }
  models = r.models;
  sel.hidden = !models.length;
  if (!models.length) {
    const m = r.suggested;
    $("#banner").innerHTML = `<div class="banner"><span>${esc(T.noModels)}</span><button class="pill dark" id="pull-btn" type="button">${esc(T.pull(m))}</button>
      <span class="mono">${esc(T.pullCmd)} <code>ollama pull ${esc(m)}</code></span></div>`;
    $("#pull-btn").onclick = async () => {
      $("#banner").innerHTML = `<div class="banner"><span class="spin"></span><span>${esc(T.pulling(m))}</span></div>`;
      try { const p = await api("/api/chat/pull", { model: m }); if (!p.ok) return banner(errText(p), true); } catch (e) { return banner(e.message, true); }
      loadModels();
    };
    return;
  }
  // orden: el modelo por defecto de Ajustes (brain-chat-default), el último elegido, uno conocido, el primero
  const has = n => n && models.some(m => m.name === n);
  const def = store.get("brain-chat-default"), saved = store.get("brain-chat-model");
  const pick = has(def) ? def : has(saved) ? saved : (models.find(m => /^(llama3|qwen|mistral|gemma)/.test(m.name)) || models[0]).name;
  sel.innerHTML = models.map(m => `<option value="${esc(m.name)}" ${m.name === pick ? "selected" : ""} data-sub="${esc([m.params, kTok(m.ctx)].filter(Boolean).join(" · "))}">${esc(shortName(m.name))}</option>`).join("");
  BrainUI.sync(sel);
  banner(historyOk ? "" : T.noHistory);
  renderModelBox(); renderCtx();
}
const shortName = n => String(n || "").replace(/:latest$/, "").replace(/^hf\.co\/[^/]+\//, "");
const kTok = n => !n ? "" : n >= 1024 ? `${Math.round(n / 1024)}k` : String(n);
const modelInfo = n => models.find(m => m.name === n);
$("#model").onchange = () => { store.set("brain-chat-model", $("#model").value); renderCtx(); };
BrainUI.select($("#model"));

// El modelo se elige solo en un chat nuevo; después de enviar el primer mensaje queda fijo para ese chat
// (se muestra como etiqueta). Si el modelo del chat ya no está instalado, vuelve el selector.
const locked = () => !!(current || messages.length) && !!chatModel && !!modelInfo(chatModel);
function renderModelBox() {
  const tag = $("#model-tag"), sel = $("#model");
  if (!models.length) { tag.hidden = true; return; }
  const lock = locked();
  sel.hidden = lock;
  tag.hidden = !lock;
  if (lock) {
    tag.innerHTML = `${ICON.lock}<span>${esc(shortName(chatModel))}</span>`;
    tag.title = T.modelLocked(shortName(chatModel));
  } else if ((current || messages.length) && chatModel && !modelInfo(chatModel)) {
    sel.title = T.modelMissing(shortName(chatModel));
  } else sel.title = T.model;
}
function activeModel() { return locked() ? chatModel : $("#model").value; }

// ================= ventana de contexto =================
function renderCtx() {
  const b = $("#ctx"), info = modelInfo(activeModel()) || {};
  const ctx = usage.ctx || info.ctx || 0, mx = usage.max || info.ctx_max || ctx;
  const pct = ctx ? Math.min(1, usage.tokens / ctx) : 0;
  const C = 2 * Math.PI * 9;
  b.querySelector(".fill").setAttribute("stroke-dashoffset", String(C * (1 - pct)));
  b.classList.toggle("full", pct >= 0.9);
  b.hidden = !ctx && !usage.tokens;
  const tip = !usage.tokens || !ctx ? T.ctxNone : T.ctxTip(usage.tokens, ctx, mx) + (pct >= 0.9 ? `\n${T.ctxFull}` : "");
  $("#ctx-tip").textContent = tip.trim();
  b.setAttribute("aria-label", tip.trim());
}
$("#ctx").onclick = () => { const b = $("#ctx"); b.classList.toggle("show"); setTimeout(() => b.classList.remove("show"), 3500); };
function banner(text, err = false) { $("#banner").innerHTML = text ? `<div class="banner ${err ? "err" : ""}">${esc(text)}</div>` : ""; }

// ================= historial =================
async function loadChats() {
  let r;
  try { r = await api("/api/chat/list"); } catch (e) { r = { ok: false }; }
  const was = historyOk;
  historyOk = !!r.ok;
  chats = r.ok ? r.chats : [];
  renderList();
  if (was !== historyOk && models.length) banner(historyOk ? "" : T.noHistory);
}
function renderList() {
  const q = $("#hist-q").value.trim().toLowerCase();
  const list = chats.filter(c => !q || (c.title || "").toLowerCase().includes(q));
  $("#hist-list").innerHTML = list.length ? list.map(c => `<li class="${c.id === current ? "on" : ""}">
      <button class="open" type="button" data-id="${esc(c.id)}"><b>${esc(c.title)}</b><span>${esc(c.updated_at ? ago(c.updated_at) : "")}</span></button>
      <button class="x" type="button" data-del="${esc(c.id)}" title="${esc(T.del)}" aria-label="${esc(T.del)}">${ICON.x}</button></li>`).join("")
    : `<li class="hist-empty">${esc(historyOk ? T.noChats : T.noHistory)}</li>`;
  $("#hist-list").querySelectorAll("button.open").forEach(b => b.onclick = () => { openChat(b.dataset.id); document.body.classList.remove("hist-open"); });
  $("#hist-list").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!(await BrainUI.confirm(T.delConfirm, { ok: T.delOk, cancel: T.cancel, danger: true }))) return;
    try { await api("/api/chat/delete", { id: b.dataset.del }); } catch (e) { banner(e.message, true); }
    if (b.dataset.del === current) newChat();
    loadChats();
  });
}
$("#hist-q").oninput = renderList;
async function openChat(id) {
  if (busy) return;
  try {
    const r = await api(`/api/chat/get?id=${encodeURIComponent(id)}`);
    if (!r.ok) { banner(errText(r), true); if (r.code === "not_found") newChat(); return; }
    current = id; messages = r.chat.messages.map(m => ({ role: m.role, content: m.content, tools: m.tools || [], compact: !!m.compact }));
    chatModel = r.chat.model || "";
    const info = modelInfo(chatModel) || {};
    usage = { tokens: r.chat.tokens || 0, ctx: r.chat.ctx || info.ctx || 0, max: info.ctx_max || 0 };
    store.set("brain-chat-current", id);
    renderList(); renderMessages(true); renderModelBox(); renderCtx();
  } catch (e) { banner(e.message, true); }
}
function newChat() {
  if (busy) stop();
  current = null; messages = []; chatModel = ""; usage = { tokens: 0, ctx: 0, max: 0 };
  store.set("brain-chat-current", "");
  const def = store.get("brain-chat-default");
  if (def && models.some(m => m.name === def)) { $("#model").value = def; BrainUI.sync($("#model")); store.set("brain-chat-model", def); }
  renderList(); renderMessages(); renderModelBox(); renderCtx(); $("#text").focus();
}
$("#new-btn").onclick = newChat; $("#new-btn-2").onclick = newChat;
$("#hist-btn").onclick = () => document.body.classList.toggle("hist-open");
document.addEventListener("click", e => {
  if (document.body.classList.contains("hist-open") && !e.target.closest("#hist") && !e.target.closest("#hist-btn")) document.body.classList.remove("hist-open");
});

// ================= mensajes =================
const argsLine = a => Object.entries(a || {}).map(([k, v]) => `${k}=${typeof v === "string" ? JSON.stringify(v.length > 40 ? v.slice(0, 40) + "…" : v) : JSON.stringify(v)}`).join(" ");
function callHtml(t, i, open) {
  const st = t.ok === undefined ? '<span class="spin"></span>' : t.ok ? ICON.check : ICON.x;
  const cls = t.ok === undefined ? "" : t.ok ? "ok" : "err";
  const result = t.ok === undefined ? T.running : (t.result || "");
  return `<details class="call ${cls}" data-call="${i}" ${open.has(i) ? "open" : ""}><summary><span class="st">${st}</span><b>${esc(t.name)}</b><span class="args">${esc(argsLine(t.args))}</span>${ICON.chev.replace("<svg", '<svg class="chev"')}</summary>
    <div class="call-b"><span class="k">${esc(T.args)}</span><pre>${esc(JSON.stringify(t.args || {}, null, 2))}</pre>
    <span class="k">${esc(T.result)}</span><pre>${esc(result)}</pre></div></details>`;
}
function msgHtml(m, i, open = new Set()) {
  if (m.role === "user") {
    const c = /^\/([a-z]+)\b\s*([\s\S]*)$/.exec(m.content || "");
    return c && COMMANDS.includes(c[1]) ? `<div class="msg user"><span class="cmd-chip">/${esc(c[1])}</span>${esc(c[2])}</div>` : `<div class="msg user">${esc(m.content)}</div>`;
  }
  const tools = m.tools || [];
  const trace = tools.length ? `<div class="trace"><div class="trace-h">${esc(T.actions(tools.length))}</div>${tools.map((t, j) => callHtml(t, j, open)).join("")}</div>` : "";
  const notes = (m.notes || []).map(n => `<div class="note ${n.err ? "err" : ""}">${esc(n.text)}</div>`).join("");
  const body = m.content || !m.live ? `<div class="body ${m.live ? "cursor" : ""}">${md(m.content)}</div>` : `<div class="body cursor"></div>`;
  if (m.compact) return `<div class="msg assistant compact" data-i="${i}"><div class="compact-h">${esc(T.compacted)}</div>${body}${notes}</div>`;
  return `<div class="msg assistant" data-i="${i}"><div class="who">${ICON.mark}${esc(T.brain)}</div>${trace}${body}${notes}</div>`;
}
function renderMessages(scroll = true) {
  const col = $("#col"), box = $("#msgs");
  if (!$("#title-input")) $("#title").textContent = currentTitle();
  $("#rename-btn").hidden = !current || !historyOk || !!$("#title-input");
  if (!messages.length) {
    col.innerHTML = `<div class="empty"><h1>${esc(T.emptyT)}</h1><p>${esc(T.emptyP)}</p>
      <div class="sugs">${T.sugs.map(s => `<button class="pill" type="button" data-sug="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>`;
    col.querySelectorAll("[data-sug]").forEach(b => b.onclick = () => { $("#text").value = b.dataset.sug; send(); });
    return;
  }
  col.innerHTML = messages.map((m, i) => msgHtml(m, i)).join("");
  if (scroll) box.scrollTop = box.scrollHeight;
}
let raf = 0;
function updateLive() {
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = 0;
    const box = $("#msgs"), i = messages.length - 1, el = box.querySelector(`.msg[data-i="${i}"]`);
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 90;
    if (el) {
      // conservar las llamadas que el usuario abrió mientras se generaba la respuesta
      const open = new Set([...el.querySelectorAll("details.call[open]")].map(d => +d.dataset.call));
      el.outerHTML = msgHtml(messages[i], i, open);
    } else renderMessages(false);
    if (atBottom) box.scrollTop = box.scrollHeight;
  });
}

async function send() {
  const text = $("#text").value.trim();
  if (!text || busy) return;
  if (text === "/new") { $("#text").value = ""; autosize(); hideCmds(); newChat(); return; }
  const compacting = /^\/compact\b/.test(text);
  if (compacting && !messages.some(m => m.role === "assistant" && !m.compact)) { hideCmds(); banner(T.nothingToCompact, true); return; }
  const model = activeModel();
  if (!model) { banner(T.err.no_model, true); return; }
  if (!chatModel || !modelInfo(chatModel)) chatModel = model;
  hideCmds();
  $("#text").value = ""; autosize();
  messages.push({ role: "user", content: text });
  const reply = { role: "assistant", content: "", tools: [], notes: [], live: true, compact: compacting };
  messages.push(reply);
  busy = true; renderSend(); renderMessages(); renderModelBox();
  controller = new AbortController();
  try {
    const r = await fetch("/api/chat/send", { method: "POST", signal: controller.signal,
      headers: { "Content-Type": "application/json", "X-Brain": "1" }, body: JSON.stringify({ text, model, chat_id: current, lang, system: store.get("brain-chat-system") || "" }) });
    if (!r.ok || !r.body) throw new Error(`HTTP ${r.status}`);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (line) handle(JSON.parse(line), reply);
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") reply.notes.push({ text: e.message, err: true });
  } finally {
    reply.live = false; busy = false; controller = null;
    if (!reply.content && !reply.tools.length && !reply.notes.length) messages.pop();
    renderSend(); updateLive(); loadChats();
  }
}
function handle(ev, reply) {
  if (ev.type === "start") { current = ev.chat_id; store.set("brain-chat-current", current); if (!chats.some(c => c.id === current)) chats.unshift({ id: current, title: ev.title }); renderList(); renderMessages(false); }
  else if (ev.type === "usage") { usage = { tokens: ev.tokens, ctx: ev.ctx, max: ev.max }; renderCtx(); return; }
  else if (ev.type === "token") reply.content += ev.text;
  else if (ev.type === "rewrite") reply.content = ev.text;
  else if (ev.type === "tool") reply.tools[ev.i ?? reply.tools.length] = { name: ev.name, args: ev.args };
  else if (ev.type === "tool_result") {
    const t = ev.i !== undefined ? reply.tools[ev.i] : [...reply.tools].reverse().find(x => x.name === ev.name && x.ok === undefined);
    if (t) { t.ok = ev.ok; t.result = ev.result ?? ev.preview ?? ""; }
  }
  else if (ev.type === "notice") reply.notes.push({ text: ev.code === "text_tools" || ev.code === "no_tools" ? T.textTools : T.maxRounds });
  else if (ev.type === "error") reply.notes.push({ text: errText(ev), err: true });
  else if (ev.type === "done" && ev.saved === false) reply.notes.push({ text: T.notSaved });
  updateLive();
}
function stop() { if (controller) controller.abort(); }
$("#composer").onsubmit = e => { e.preventDefault(); busy ? stop() : send(); };
$("#text").addEventListener("keydown", e => {
  if (!$("#cmds").hidden && cmdList.length) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); cmdOn = (cmdOn + (e.key === "ArrowDown" ? 1 : -1) + cmdList.length) % cmdList.length; renderCmds(); return; }
    if ((e.key === "Enter" && !e.shiftKey) || e.key === "Tab") { e.preventDefault(); pickCmd(cmdList[cmdOn]); return; }
    if (e.key === "Escape") { e.preventDefault(); cmdDismissed = $("#text").value; hideCmds(); return; }
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!busy) send(); }
});
function autosize() { const t = $("#text"); t.style.height = "auto"; t.style.height = Math.min(200, t.scrollHeight) + "px"; renderSend(); }
$("#text").addEventListener("input", () => { autosize(); updateCmds(); });

// ================= comandos (/) =================
let cmdList = [], cmdOn = 0, cmdDismissed = null;
function updateCmds() {
  const v = $("#text").value, m = /^\/([a-z]*)$/.exec(v);
  if (!m || v === cmdDismissed) return hideCmds();
  cmdList = COMMANDS.filter(c => c.startsWith(m[1]));
  if (!cmdList.length) return hideCmds();
  cmdOn = Math.min(cmdOn, cmdList.length - 1);
  renderCmds();
}
function renderCmds() {
  const box = $("#cmds");
  box.innerHTML = `<li class="cmds-h" role="presentation">${esc(T.cmdsTitle)}</li>` + cmdList.map((c, i) =>
    `<li role="option" id="cmd-${c}" data-cmd="${c}" class="${i === cmdOn ? "on" : ""}" aria-selected="${i === cmdOn}"><b>/${c}</b><span>${esc(T.cmds[c])}</span></li>`).join("");
  box.hidden = false;
  $("#text").setAttribute("aria-activedescendant", `cmd-${cmdList[cmdOn]}`);
  box.querySelectorAll("[data-cmd]").forEach(li => {
    li.onmousedown = e => e.preventDefault();
    li.onclick = () => pickCmd(li.dataset.cmd);
  });
}
function hideCmds() { $("#cmds").hidden = true; cmdList = []; $("#text").removeAttribute("aria-activedescendant"); }
function pickCmd(c) {
  hideCmds();
  if (c === "new") { $("#text").value = ""; autosize(); newChat(); return; }
  $("#text").value = `/${c} `; cmdDismissed = null; autosize(); $("#text").focus();
}

// ================= título editable =================
function currentTitle() {
  return current ? (chats.find(c => c.id === current) || {}).title || messages[0]?.content.slice(0, 60) || "" : T.newTitle;
}
$("#rename-btn").onclick = () => {
  if (!current) return;
  const old = currentTitle(), t = $("#title");
  t.hidden = true; $("#rename-btn").hidden = true;
  const inp = document.createElement("input");
  inp.className = "title-input"; inp.id = "title-input"; inp.value = old; inp.maxLength = 80; inp.setAttribute("aria-label", T.rename);
  t.after(inp); inp.focus(); inp.select();
  let done = false;
  const finish = async save => {
    if (done) return; done = true;
    const v = inp.value.trim().replace(/\s+/g, " ");
    inp.remove(); t.hidden = false;
    if (save && v && v !== old) {
      const c = chats.find(x => x.id === current); if (c) c.title = v;
      t.textContent = v; renderList();
      try { const r = await api("/api/chat/rename", { id: current, title: v }); if (!r.ok) throw new Error(errText(r)); }
      catch (e) { banner(`${T.renameErr}: ${e.message}`, true); if (c) c.title = old; }
      loadChats();
    }
    renderMessages(false);
  };
  inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); finish(true); } else if (e.key === "Escape") { e.preventDefault(); finish(false); } };
  inp.onblur = () => finish(true);
};

// ================= ventana flotante =================
// Document Picture-in-Picture (Chrome/Edge/Arc): una ventana que queda arriba de todas las apps.
// Se pide desde la ventana de arriba de todo (el dashboard) porque la API no funciona dentro de un iframe.
// Sin esa API (Safari, Firefox), se abre una ventana emergente común.
$("#pop-btn").onclick = async () => {
  const url = `/chat?mode=pop${current ? `&chat=${encodeURIComponent(current)}` : ""}`;
  const top = window.top;
  try {
    if (top.documentPictureInPicture) {
      const pip = await top.documentPictureInPicture.requestWindow({ width: 440, height: 680 });
      const d = pip.document;
      d.title = "brain · chat";
      d.body.style.cssText = "margin:0;height:100vh;overflow:hidden";
      const f = d.createElement("iframe");
      f.src = new URL(url, location.href).href;
      f.style.cssText = "border:0;width:100%;height:100%;display:block";
      f.allow = "clipboard-write";
      d.body.appendChild(f);
      return;
    }
  } catch (e) { /* se cae a la ventana común */ }
  window.open(url, "brain-chat", "popup=yes,width=440,height=700");
};

// ================= arranque =================
const narrowMq = matchMedia("(max-width: 700px)");
function applyNarrow() { document.body.classList.toggle("narrow", narrowMq.matches); applyStatic(); }
narrowMq.addEventListener("change", applyNarrow);
window.addEventListener("storage", e => {
  if (e.key === "brain-lang") { lang = e.newValue === "en" ? "en" : "es"; T = I18N[lang]; applyStatic(); }
  if (e.key === "brain-theme") applyTheme();
});
applyNarrow();
loadModels();
loadChats().then(() => {
  const start = params.get("chat") || (MODE === "pop" ? "" : store.get("brain-chat-current"));
  if (start) openChat(start);
});
setInterval(() => { if (!busy) loadChats(); }, 15000);
</script>
