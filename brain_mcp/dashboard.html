// ================= notificaciones del sistema =================
// localStorage "brain-notify" = {on, create, update, delete}. El dashboard consulta el historial del vault
// (/api/activity) cada 5 s y avisa con la Notification API: los cambios de agentes, del chat o del usuario.
const NOTIFY_DEFAULT = { on: false, create: true, update: true, delete: true };
const canNotify = () => "Notification" in window && Notification.permission === "granted";
function notifyPrefs() {
  try { return { ...NOTIFY_DEFAULT, ...JSON.parse(localStorage.getItem("brain-notify") || "{}") }; } catch (e) { return { ...NOTIFY_DEFAULT }; }
}
function saveNotify(p) { try { localStorage.setItem("brain-notify", JSON.stringify(p)); } catch (e) {} }
function renderNotify() {
  const p = notifyPrefs(), on = p.on && canNotify();
  $("#notify-on").checked = on;
  $("#notify-kinds").classList.toggle("off", !on);
  document.querySelectorAll("[data-notify]").forEach(cb => { cb.checked = !!p[cb.dataset.notify]; cb.disabled = !on; });
  $("#notify-test").disabled = !on;
}
$("#notify-on").onchange = async e => {
  const p = notifyPrefs(), out = $("#notify-result");
  if (!e.target.checked) { p.on = false; saveNotify(p); renderNotify(); return showResult(out, "ok", T.settings.notifyOff); }
  if (!("Notification" in window)) { e.target.checked = false; return showResult(out, "err", T.settings.notifyUnsupported); }
  let perm = Notification.permission;
  if (perm === "default") { try { perm = await Notification.requestPermission(); } catch (err) { perm = "denied"; } }
  if (perm !== "granted") { e.target.checked = false; return showResult(out, "err", T.settings.notifyDenied); }
  p.on = true; saveNotify(p); renderNotify(); activityLast = null; pollActivity();
  showResult(out, "ok", `${T.settings.notifyOk} ${T.settings.notifyOs}`);
};
document.querySelectorAll("[data-notify]").forEach(cb => cb.onchange = () => { const p = notifyPrefs(); p[cb.dataset.notify] = cb.checked; saveNotify(p); });
$("#notify-test").onclick = () => { if (canNotify()) new Notification(T.settings.notifyTestT, { body: T.settings.notifyTestB, tag: "brain-test" }); };
let activityLast = null;
const changeKind = c => c.op === "delete" ? "delete" : c.op === "create" ? "create" : "update";
function changeText(c) {
  const S = T.settings;
  return c.op === "move" ? S.nMove(c.path) : ({ create: S.nCreate, update: S.nUpdate, delete: S.nDelete })[changeKind(c)](c.path);
}
async function pollActivity() {
  const p = notifyPrefs();
  if (!p.on || !canNotify()) { activityLast = null; return; }
  let r; try { r = await api(`/api/activity?after=${activityLast ?? -1}`); } catch (e) { return; }
  const first = activityLast === null;
  // muchos cambios de golpe (más de los que entran en una consulta): un solo aviso con el total y se salta al último
  activityLast = r.total > r.changes.length ? r.max_id : r.last_id;
  if (first) return;  // al abrir no se avisa de lo viejo
  // un movimiento deja dos registros (origen y destino): alcanza con el destino
  const items = r.changes.filter(c => !(c.op === "move" && !c.was_new)).filter(c => p[changeKind(c)]);
  const show = (body, tag) => {
    // tag: si hay varias pestañas abiertas, la misma notificación se reemplaza en vez de repetirse
    const n = new Notification(T.settings.nTitle, { body, tag });
    n.onclick = () => { window.focus(); n.close(); };
  };
  if (r.total > r.changes.length) show(T.settings.nMany(r.total), `brain-${r.max_id}`);
  else if (items.length > 3) show(`${T.settings.nMany(items.length)}\n${items.slice(-3).map(c => c.path).join("\n")}`, `brain-${r.last_id}`);
  else items.forEach(c => show(changeText(c), `brain-${c.id}`));
}
setInterval(pollActivity, 5000);
pollActivity();
addEventListener("storage", e => { if (e.key === "brain-notify" && view === "ajustes") renderNotify(); });

// ================= ajustes: sidebar (orden y visibilidad) =================
// localStorage "brain-nav" = {order: [vistas], hidden: [vistas]}. Una vista oculta sigue accesible
// por su #hash; Ajustes no está en la lista (es el engranaje, siempre visible).
const NAV_DEFAULT = ["panel", "chat", "perfil", "agentes", "conexiones", "grafo", "conocimiento", "factcheck", "logs"];
function navPrefs() {
  let p = {};
  try { p = JSON.parse(localStorage.getItem("brain-nav") || "{}") || {}; } catch (e) {}
  const order = (Array.isArray(p.order) ? p.order : []).filter(v => NAV_DEFAULT.includes(v));
  NAV_DEFAULT.forEach(v => { if (!order.includes(v)) order.push(v); });  // vistas nuevas de futuras versiones
  const hidden = (Array.isArray(p.hidden) ? p.hidden : []).filter(v => NAV_DEFAULT.includes(v));
  return { order, hidden };
}
function saveNav(p) {
  try { localStorage.setItem("brain-nav", JSON.stringify(p)); } catch (e) { toast(e.message); }
  applyNav(); renderNavOrder();
}
function applyNav() {
  const p = navPrefs(), foot = $("nav.side .side-foot");
  p.order.forEach(v => {
    const b = $(`.nav-item[data-view="${v}"]`);
    if (!b) return;
    b.parentNode.insertBefore(b, foot);
    b.hidden = p.hidden.includes(v);
  });
}
function renderNavOrder() {
  const p = navPrefs(), n = p.order.length;
  $("#nav-order").innerHTML = p.order.map((v, i) => {
    const b = $(`.nav-item[data-view="${v}"]`), off = p.hidden.includes(v);
    const label = b ? b.querySelector("span").textContent : v;
    return `<li class="${off ? "off" : ""}"><span class="ic">${b ? b.querySelector("svg").outerHTML : ""}</span>
      <span class="nav-name">${esc(label)}</span>
      <label class="check" title="${esc(T.settings.show)}"><input type="checkbox" data-show="${v}" ${off ? "" : "checked"}> <span>${esc(T.settings.show)}</span></label>
      <button class="icon-btn mv" type="button" data-up="${i}" ${i === 0 ? "disabled" : ""} aria-label="${esc(T.settings.up(label))}" title="${esc(T.settings.up(label))}">↑</button>
      <button class="icon-btn mv" type="button" data-down="${i}" ${i === n - 1 ? "disabled" : ""} aria-label="${esc(T.settings.down(label))}" title="${esc(T.settings.down(label))}">↓</button></li>`;
  }).join("");
  const box = $("#nav-order");
  box.querySelectorAll("[data-up],[data-down]").forEach(btn => btn.onclick = () => {
    const q = navPrefs(), i = +(btn.dataset.up ?? btn.dataset.down), j = btn.dataset.up != null ? i - 1 : i + 1;
    [q.order[i], q.order[j]] = [q.order[j], q.order[i]];
    saveNav(q);
    $(`#nav-order [data-${btn.dataset.up != null ? "up" : "down"}="${j}"]`)?.focus();
  });
  box.querySelectorAll("[data-show]").forEach(cb => cb.onchange = () => {
    const q = navPrefs(), v = cb.dataset.show;
    q.hidden = cb.checked ? q.hidden.filter(x => x !== v) : [...q.hidden, v];
    if (q.hidden.length >= NAV_DEFAULT.length) { cb.checked = true; return toast(T.settings.lastOne); }
    saveNav(q);
  });
}
$("#nav-reset").onclick = () => { try { localStorage.removeItem("brain-nav"); } catch (e) {} applyNav(); renderNavOrder(); };

// ================= ajustes: modelo por defecto del chat =================
// localStorage "brain-chat-default": el chat lo usa al abrir y en cada chat nuevo (vacío = el último usado)
async function loadDefaultModel() {
  const sel = $("#default-model"), hint = $("#default-model-hint");
  let cur = ""; try { cur = localStorage.getItem("brain-chat-default") || ""; } catch (e) {}
  let r; try { r = await api("/api/chat/models"); } catch (e) { r = { ok: false }; }
  const models = r.ok ? r.models : [];
  const names = models.map(m => m.name);
  if (cur && !names.includes(cur)) names.unshift(cur);  // configurado pero no instalado (u Ollama apagado)
  sel.innerHTML = `<option value="">${esc(T.settings.lastUsed)}</option>` + names.map(n =>
    `<option value="${esc(n)}" ${n === cur ? "selected" : ""}>${esc(n.replace(/:latest$/, ""))}</option>`).join("");
  hint.textContent = !r.ok ? T.settings.noOllama : !models.length ? T.settings.noModels
    : cur && !models.some(m => m.name === cur) ? T.settings.notInstalled : T.settings.defaultHint;
}
BrainUI.select($("#default-model"));
$("#default-model").onchange = e => {
  try { e.target.value ? localStorage.setItem("brain-chat-default", e.target.value) : localStorage.removeItem("brain-chat-default"); } catch (err) {}

};

// ================= ajustes: versión y actualizaciones =================
// El chequeo va a GitHub solo cuando se toca el botón. El resultado queda en localStorage
// ("brain-update" = {latest, url}) para que el engranaje siga en verde hasta actualizar.
let appVersion = null, canUpdate = false, updateFailed = false;
const verNum = v => (String(v || "").split("-")[0].match(/\d+/g) || ["0"]).map(Number);
const newer = (a, b) => { const x = verNum(a), y = verNum(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
function pendingUpdate() {
  let u = null; try { u = JSON.parse(localStorage.getItem("brain-update") || "null"); } catch (e) {}
  return u && appVersion && newer(u.latest, appVersion) ? u : null;
}
function renderUpdateBadge() {
  const u = pendingUpdate(), b = $("#settings-btn");
  b.classList.toggle("has-update", !!u);
  if (u) { b.title = T.settings.badge(u.latest); b.setAttribute("aria-label", T.settings.badge(u.latest)); }
  const note = $("#update-note");
  note.hidden = !u;
  $("#update-apply").hidden = !(u && canUpdate);
  if (u) note.innerHTML = `<b>${esc(T.settings.available(u.latest))}</b><br>${esc(canUpdate ? T.settings.howTo : T.settings.howToCli)} <code>brain update</code> · <a href="${esc(u.url)}" target="_blank" rel="noopener">${esc(T.settings.notes)}</a>`;
}
async function loadVersion() {
  try {
    const v = await api("/api/version");
    appVersion = v.current; canUpdate = !!v.can_update; updateFailed = v.update_failed || "";
  } catch (e) {}
  $("#ver-current").textContent = appVersion || "";
  renderUpdateBadge();
  // volvimos de "Actualizar y reiniciar": contar cómo salió
  let up = null; try { up = JSON.parse(sessionStorage.getItem("brain-updating") || "null"); sessionStorage.removeItem("brain-updating"); } catch (e) {}
  if (up && appVersion) {
    if (appVersion !== up.from && updateFailed === "sync") { showResult($("#update-result"), "err", T.settings.updateSyncFailed); go("ajustes"); }
    else if (appVersion !== up.from) { showResult($("#update-result"), "ok", T.settings.updateDone(appVersion)); toast(T.settings.updateDone(appVersion)); }
    else if (updateFailed) { showResult($("#update-result"), "err", updateFailed === "sync" ? T.settings.updateSyncFailed : T.settings.updateFailed); go("ajustes"); }
    else showResult($("#update-result"), "info", T.settings.upToDate(appVersion));
  }
}
// "Actualizar y reiniciar": el dashboard se cierra, el lanzador (brain.sh / brain.ps1) actualiza y lo vuelve a
// abrir; esta página espera a que vuelva a responder y se recarga.
$("#update-apply").onclick = async () => {
  const u = pendingUpdate(), out = $("#update-result"), btn = $("#update-apply");
  if (!u) return;
  if (!(await ask(T.settings.updateConfirm(u.latest), { ok: T.settings.updateNow }))) return;
  btn.disabled = true;
  let r;
  try { r = await api("/api/update/apply", {}); }
  catch (e) { btn.disabled = false; return showResult(out, "err", e.message); }
  if (!r.ok) { btn.disabled = false; return showResult(out, "err", r.code === "no_launcher" ? T.settings.updateNoLauncher : T.err.other); }
  try { sessionStorage.setItem("brain-updating", JSON.stringify({ from: r.current, to: u.latest })); } catch (e) {}
  const ov = document.createElement("div");
  ov.className = "updating"; ov.setAttribute("role", "alertdialog"); ov.setAttribute("aria-live", "polite");
  ov.innerHTML = `<div><b>${esc(T.settings.updatingT(u.latest))}</b><span>${esc(T.settings.updatingP)}</span><span class="muted" id="updating-slow"></span></div>`;
  document.body.appendChild(ov);
  const t0 = Date.now();
  let wentDown = false;
  const tick = async () => {
    try {
      const res = await fetch("/api/version", { cache: "no-store" });
      if (res.ok && (wentDown || Date.now() - t0 > 20000)) return location.reload();
    } catch (e) { wentDown = true; }
    if (Date.now() - t0 > 120000) $("#updating-slow").textContent = T.settings.updateSlow;
    setTimeout(tick, 1500);
  };
  setTimeout(tick, 1500);
};
$("#update-btn").onclick = async () => {
  const btn = $("#update-btn"), out = $("#update-result");
  btn.disabled = true; showResult(out, "info", T.settings.checking, true);
  try {
    const r = await api("/api/version/check", {});
    if (!r.ok) { showResult(out, "err", r.code === "offline" ? T.settings.offline : `${T.err.other} ${r.detail || ""}`); return; }
    saveCheck(r);
    if (r.update_available) out.className = "result";
    else showResult(out, "ok", r.latest ? T.settings.upToDate(r.current) : T.settings.noReleases);
  } catch (e) { showResult(out, "err", e.message); }
  finally { btn.disabled = false; }
};
function saveCheck(r) {
  appVersion = r.current;
  try {
    r.update_available ? localStorage.setItem("brain-update", JSON.stringify({ latest: r.latest, url: r.url })) : localStorage.removeItem("brain-update");
    localStorage.setItem("brain-update-checked", String(Date.now()));
  } catch (e) {}
  renderUpdateBadge();
}
// Chequeo automático: al abrir el dashboard y cada 3 horas mientras está abierto. Si otra pestaña (o una
// recarga) ya chequeó hace menos de 10 minutos, se saltea, así no se gasta el límite de la API de GitHub.
const UPDATE_EVERY = 3 * 3600 * 1000, UPDATE_MIN_GAP = 10 * 60 * 1000;
async function autoCheck() {
  let last = 0; try { last = +localStorage.getItem("brain-update-checked") || 0; } catch (e) {}
  if (Date.now() - last < UPDATE_MIN_GAP) return;
  try { const r = await api("/api/version/check", {}); if (r.ok) saveCheck(r); } catch (e) { /* sin internet: se reintenta en el próximo ciclo */ }
}
loadVersion().then(autoCheck);
setInterval(autoCheck, UPDATE_EVERY);

// ================= API =================
async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-Brain": "1" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 4200);
}
function showResult(el, kind, text, spinner = false) {
  el.className = `result show ${kind}`;
  el.innerHTML = `${spinner ? '<span class="spin"></span>' : kind === "ok" ? ICON.check : ICON.alert}<span>${esc(text)}</span>`;
}

function uptime(s) {

// ================= gráficos (SVG a mano) =================
const tip = $("#tip");
function showTip(e, html) { tip.innerHTML = html; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.style.opacity = 1; }
function hideTip() { tip.style.opacity = 0; }
// barra con extremo de datos redondeado (4px) y apoyada en la línea base
function vbar(x, y, w, h, r = 4) {
  if (h <= 0) return "";
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function hbar(x, y, w, h, r = 4) {
  if (w <= 0) return "";
  r = Math.min(r, h / 2, w);
  return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
}
// máximo "redondo" y par, así la línea del medio también es un entero (son conteos)
function niceMax(v) { if (v <= 4) return 4; const p = 10 ** Math.floor(Math.log10(v)); const m = [1, 2, 4, 6, 8, 10].find(m => m * p >= v); return m * p; }
const dayFmt = () => new Intl.DateTimeFormat(locale(), { day: "numeric", month: "short" });
const parseDay = d => { const [y, m, dd] = d.split("-").map(Number); return new Date(y, m - 1, dd); };
let tableOpen = false;

function activityChart(el, data) {
  const total = data.reduce((a, d) => a + d.count, 0);
  $("#activity-sub").textContent = T.chart.changes(fmt(total));
  const W = Math.max(320, el.clientWidth || 700), H = 190, L = 28, R = 6, TOP = 10, B = 24;
  const max = niceMax(Math.max(1, ...data.map(d => d.count)));
  const iw = W - L - R, ih = H - TOP - B, step = iw / data.length, bw = Math.max(3, Math.min(18, step - 2));
  const df = dayFmt();
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T.chart.aria)}">`;
  s += `<g class="axis">${[0, max / 2, max].map(v => { const y = TOP + ih - (v / max) * ih; return `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 3.5}" text-anchor="end">${fmt(v)}</text>`; }).join("")}</g>`;
  data.forEach((d, i) => {
    const x = L + i * step + (step - bw) / 2, h = (d.count / max) * ih;
    s += `<path class="bar" data-i="${i}" d="${vbar(x, TOP + ih - h, bw, h)}"/>`;
    s += `<rect data-i="${i}" x="${L + i * step}" y="${TOP}" width="${step}" height="${ih}" fill="transparent"/>`;
    if (i % 7 === (data.length - 1) % 7) s += `<text x="${L + i * step + step / 2}" y="${H - 6}" text-anchor="middle" style="font-size:11px;fill:var(--text-3)">${df.format(parseDay(d.day))}</text>`;
  });
  s += `<line class="baseline" x1="${L}" x2="${W - R}" y1="${TOP + ih}" y2="${TOP + ih}"/></svg>`;
  el.innerHTML = s;
  el.querySelectorAll("rect[data-i]").forEach(r => {
    const i = +r.dataset.i, bar = el.querySelector(`path[data-i="${i}"]`);
    r.onmousemove = e => { bar && bar.classList.add("hi"); const d = data[i];
      showTip(e, `${df.format(parseDay(d.day))} · <b>${fmt(d.count)}</b> ${T.chart.change(d.count)}`); };
    r.onmouseleave = () => { bar && bar.classList.remove("hi"); hideTip(); };
  });
  $("#table-activity").innerHTML = tableOpen
    ? `<table class="data"><thead><tr><th>${T.chart.day}</th><th class="num">${T.chart.count}</th></tr></thead><tbody>${data.filter(d => d.count).reverse()
        .map(d => `<tr><td>${df.format(parseDay(d.day))}</td><td class="num">${fmt(d.count)}</td></tr>`).join("") || `<tr><td colspan="2" class="muted">${T.chart.noChanges}</td></tr>`}</tbody></table>` : "";
}
function barList(el, data, emptyMsg, unit) {
  if (!data.length || data.every(d => !d.value)) { el.innerHTML = `<div class="empty-chart">${emptyMsg}</div>`; return; }
  const W = Math.max(260, el.clientWidth || 320), row = 30, labelW = Math.min(150, W * 0.42), valW = 34;
  const H = data.length * row, max = Math.max(...data.map(d => d.value)), bw = W - labelW - valW;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  data.forEach((d, i) => {
    const y = i * row + 8, h = 14, w = Math.max(d.value ? 3 : 0, (d.value / max) * bw);
    const label = d.label.length > 22 ? d.label.slice(0, 21) + "…" : d.label;
    s += `<text class="hbar-label" x="0" y="${y + 11}">${esc(label)}</text>`;
    s += `<rect class="track" x="${labelW}" y="${y}" width="${bw}" height="${h}" rx="4"/>`;
    s += `<path class="bar" data-i="${i}" d="${hbar(labelW, y, w, h)}"/>`;
    s += `<text class="hbar-value" x="${W}" y="${y + 11}" text-anchor="end">${fmt(d.value)}</text>`;
    s += `<rect data-i="${i}" x="0" y="${i * row}" width="${W}" height="${row}" fill="transparent"/>`;
  });
  el.innerHTML = s + "</svg>";
  el.querySelectorAll("rect[data-i]").forEach(r => {
    const i = +r.dataset.i, bar = el.querySelector(`path[data-i="${i}"]`);
    r.onmousemove = e => { bar && bar.classList.add("hi"); showTip(e, `${esc(data[i].label)} · <b>${fmt(data[i].value)}</b> ${unit}`); };
    r.onmouseleave = () => { bar && bar.classList.remove("hi"); hideTip(); };
  });
}
$("#table-toggle").onclick = () => {

  $("#table-toggle").textContent = tableOpen ? T.chart.hideTable : T.chart.table;
  if (stats) activityChart($("#chart-activity"), stats.activity);

  if (a < 3600) return rel.format(Math.round(s / 60), "minute");
  if (a < 86400) return rel.format(Math.round(s / 3600), "hour");

}

// antigüedad del contenido guardado: reciente (≤7 días), normal, vieja (>30 días)
function freshStamp(iso) {
  if (!iso) return "—";
  const days = (Date.now() - new Date(iso)) / 864e5;
  const cls = days > 30 ? "old" : days <= 7 ? "new" : "";
  return `<span class="fresh ${cls}" title="${esc(T.know.freshTip)}">${esc(ago(iso))}${cls ? ` · ${esc(cls === "old" ? T.know.old : T.know.recent)}` : ""}</span>`;
}
$("#refresh-all").onclick = async () => {
  $("#refresh-all").disabled = true;
  try { await api("/api/sources/refresh_all", {}); } catch (e) { toast(e.message); }
  pollRefresh();
};
async function pollRefresh() {
  let st;
  try { st = await (await fetch("/api/sources/refresh_status")).json(); } catch (e) { return; }
  $("#refresh-all-st").textContent = st.running ? T.know.refreshing(st.done, st.total)
    : st.total ? T.know.refreshDone(st.updated, st.unchanged, st.errors.length) : "";
  $("#refresh-all").disabled = st.running;
  if (st.running) setTimeout(pollRefresh, 1500); else { statsSig = ""; loadStats(); }
}
async function loadStats() {
  try {
    const s = await api("/api/stats");
    const sig = JSON.stringify(s);
    if (sig === statsSig) return;
    statsSig = sig; stats = s; renderStats();
  } catch (e) { /* reintenta en el próximo ciclo */ }
}
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => stats && renderStats(), 150); });

// ================= perfil y memoria =================
let profile = null, memoryCats = [], memSource = "claude", memPreview = null;
const SOURCE_NAMES = { claude: "Claude", chatgpt: "ChatGPT", gemini: "Gemini", other: null };
const srcName = k => SOURCE_NAMES[k] || T.mem.other;
function initials(name) { return (name || "").trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase() || "?"; }
function renderProfileView() {
  if (!profile) return;
  $("#avatar").textContent = initials(profile.name);
  $("#p-name-view").textContent = profile.name || T.profile.empty;
  $("#p-head-view").textContent = profile.headline || "";
}
async function loadProfile() {
  try {
    const r = await api("/api/profile");
    const first = profile === null;
    profile = r.profile; memoryCats = r.memory;
    if (first) { $("#p-name").value = profile.name; $("#p-headline").value = profile.headline; $("#p-about").value = profile.about; }
    autoAbout = r.auto_about || autoAbout;
    renderProfileView(); renderMemory(); renderAutoAbout();
    // la memoria cambió y el resumen se está reescribiendo en segundo plano: se vuelve a pedir en un rato
    if (autoAbout.stale && view === "perfil") setTimeout(() => { if (view === "perfil") loadProfile(); }, 6000);
  } catch (e) { toast(e.message); }
}
$("#profile-form").onsubmit = async e => {
  e.preventDefault();
  const btn = $("#p-save"); btn.disabled = true;
  try {
    await api("/api/profile", { name: $("#p-name").value, headline: $("#p-headline").value, about: $("#p-about").value });
    showResult($("#profile-result"), "ok", T.profile.saved);
    profile = { ...profile, name: $("#p-name").value, headline: $("#p-headline").value };
    renderProfileView(); statsSig = "";
  } catch (e2) { showResult($("#profile-result"), "err", e2.message); }
  finally { btn.disabled = false; }
};
let autoAbout = { enabled: true, stale: false };
function renderAutoAbout() {
  if (!profile) return;
  const P = T.profile;
  $("#auto-about-on").checked = autoAbout.enabled;
  $("#auto-about-text").textContent = (profile.auto_about || "").replace(/\*\*/g, "") || (autoAbout.enabled ? (autoAbout.stale ? P.autoBusy : P.autoNone) : P.autoOff);
  $("#auto-about-when").textContent = autoAbout.stale && autoAbout.enabled ? P.autoStale : profile.auto_updated ? P.autoWhen(ago(profile.auto_updated)) : "";
}
async function autoAboutPost(body) {
  const b = $("#auto-about-refresh"); b.disabled = true;
  if (body.refresh) $("#auto-about-when").textContent = T.profile.autoBusy;
  try {
    const r = await api("/api/profile/auto", body);
    autoAbout = { enabled: r.enabled, stale: false }; profile = { ...profile, auto_about: r.profile.auto_about, auto_updated: r.profile.auto_updated };
    renderAutoAbout();
  } catch (e) { toast(e.message); } finally { b.disabled = false; }
}
$("#auto-about-on").onchange = () => autoAboutPost({ enabled: $("#auto-about-on").checked, refresh: $("#auto-about-on").checked });
$("#auto-about-refresh").onclick = () => autoAboutPost({ refresh: true });
function renderMemory() {
  const q = $("#mem-filter").value.trim().toLowerCase();
  const total = memoryCats.reduce((a, c) => a + c.items.length, 0);
  $("#mem-sub").textContent = T.mem.count(fmt(total), fmt(memoryCats.length));
  if (!total) { $("#mem-list").innerHTML = `<div class="empty-chart" style="height:110px">${esc(T.mem.none)}</div>`; return; }
  $("#mem-list").innerHTML = memoryCats.map(c => {
    const items = c.items.filter(i => !q || i.toLowerCase().includes(q) || c.category.toLowerCase().includes(q));
    if (!items.length) return "";
    return `<div class="mem-cat"><div class="mem-cat-h">${esc(c.category)}<span class="count">${fmt(c.items.length)}</span>
      <span class="src">${esc((c.sources || []).map(srcName).join(" · "))}</span></div>
      <ul class="mem-items">${items.map(i => `<li><span>${esc(i)}</span><button class="x-btn" title="${esc(T.mem.del)}" aria-label="${esc(T.mem.del)}" data-cat="${esc(c.category)}" data-item="${esc(i)}">×</button></li>`).join("")}</ul></div>`;

  $("#mem-list").querySelectorAll(".x-btn").forEach(b => b.onclick = async () => {

$("#mem-filter").oninput = renderMemory;
function renderMemSource() {
  $("#mem-source").innerHTML = Object.keys(SOURCE_NAMES).map(k =>
    `<button type="button" class="${k === memSource ? "on" : ""}" data-src="${k}">${esc(srcName(k))}</button>`).join("");
  $("#mem-source").querySelectorAll("button").forEach(b => b.onclick = () => { memSource = b.dataset.src; renderMemSource(); });
  $("#step2-t").textContent = T.mem.step2(memSource === "other" ? (lang === "en" ? "your chatbot" : "tu chatbot") : srcName(memSource));
  $("#mem-prompt").textContent = MEM_PROMPT[lang];
}
$("#copy-prompt").onclick = async () => {
  try { await navigator.clipboard.writeText(MEM_PROMPT[lang]); }
  catch (e) { const r = document.createRange(); r.selectNodeContents($("#mem-prompt")); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand("copy"); }
  $("#copy-ok").textContent = T.mem.copied; setTimeout(() => $("#copy-ok").textContent = "", 2000);
};
$("#mem-file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $("#mem-text").value = await f.text(); e.target.value = "";
  $("#mem-preview-btn").click();
};
$("#mem-preview-btn").onclick = async () => {
  const out = $("#mem-result");
  try {
    const r = await api("/api/memory/parse", { text: $("#mem-text").value });
    memPreview = r.categories;
    if (!memPreview.length) { memPreview = null; $("#mem-preview").innerHTML = ""; showResult(out, "err", T.mem.nothing); return; }
    out.className = "result"; renderPreview();
  } catch (e) { showResult(out, "err", e.message); }
};
function renderPreview() {
  const n = memPreview.reduce((a, c) => a + c.items.length, 0);
  $("#mem-preview").innerHTML = `<div class="preview"><div class="preview-h"><strong style="font-size:13px">${esc(T.mem.found(fmt(n), fmt(memPreview.length)))}</strong>
    <button class="btn primary" id="mem-import-btn" type="button">${esc(T.mem.importBtn(fmt(n)))}</button></div>
    <div class="preview-b">${memPreview.map((c, ci) => `<div class="mem-cat"><div class="mem-cat-h">${esc(c.category)}<span class="count">${fmt(c.items.length)}</span></div>
      <ul class="mem-items">${c.items.map((i, ii) => `<li><span>${esc(i)}</span><button class="x-btn" data-c="${ci}" data-i="${ii}" title="${esc(T.mem.del)}" aria-label="${esc(T.mem.del)}">×</button></li>`).join("")}</ul></div>`).join("")}</div></div>`;
  // sacar ítems de la previsualización antes de importar
  $("#mem-preview").querySelectorAll(".x-btn").forEach(b => b.onclick = () => {
    memPreview[+b.dataset.c].items.splice(+b.dataset.i, 1);
    memPreview = memPreview.filter(c => c.items.length);
    if (memPreview.length) renderPreview(); else { memPreview = null; $("#mem-preview").innerHTML = ""; }
  });
  $("#mem-import-btn").onclick = async () => {
    const btn = $("#mem-import-btn"); btn.disabled = true;
    try {
      const r = await api("/api/memory/import", { source: memSource, categories: memPreview });
      showResult($("#mem-result"), r.added ? "ok" : "info", r.added ? T.mem.imported(fmt(r.added), r.files.length) : T.mem.noneNew);
      memPreview = null; $("#mem-preview").innerHTML = ""; $("#mem-text").value = "";
      statsSig = ""; loadProfile();
    } catch (e) { showResult($("#mem-result"), "err", e.message); btn.disabled = false; }
  };
}

// ================= conectar agente =================
let agentsData = null, agentTab = "connect";
const agentNote = {};  // mensaje post-acción por cliente (se ve en su tarjeta)
function agentPill(a) {
  if (a.connected) return `<span class="pill ${a.elsewhere ? "st-starting" : "st-running"}">${a.elsewhere ? ICON.alert : ICON.check}${esc(a.elsewhere ? T.agents.elsewhere : T.agents.connected)}</span>`;
  return `<span class="pill ${a.installed ? "st-stopped" : "st-none"}">${ICON.dot}${esc(a.installed ? T.agents.notConnected : T.agents.notInstalled)}</span>`;
}
function formAgentCard(a) {
  // apps que agregan servers locales con su propio formulario ("Run a command"), sin archivo de config que
  // brain pueda escribir (Manus Studio): valores para copiar, y "Detectado" cuando ya usó brain
  const steps = T.agents[`${a.key}Steps`] || [];
  const pill = a.detected ? `<span class="pill st-running">${ICON.check}${esc(T.agents.detected)}</span>`
    : `<span class="pill ${a.installed ? "st-stopped" : "st-none"}">${ICON.dot}${esc(a.installed ? T.agents.byForm : T.agents.notInstalled)}</span>`;
  return `<div class="card agent">
    <div class="agent-top"><div class="agent-name">${esc(a.name)}</div>${pill}</div>
    <div class="agent-desc">${esc(T.agents.desc[a.key] || "")}</div>
    ${steps.length ? `<ol class="agent-steps">${steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}
  </div>`;
}
function agentCard(a) {
  if (a.kind === "form") return formAgentCard(a);
  const share = a.shares ? agentsData.agents.find(x => x.key === a.shares) : null;
  const btn = a.connected && !a.elsewhere
    ? `<button class="btn" data-agent="${a.key}" data-act="disconnect">${esc(T.agents.disconnect)}</button>`
    : `<button class="btn primary" data-agent="${a.key}" data-act="connect">${esc(a.elsewhere ? T.agents.reconnect : T.agents.connect)}</button>`;
  const note = agentNote[a.key];
  return `<div class="card agent">
    <div class="agent-top"><div class="agent-name">${esc(a.name)}</div>${agentPill(a)}</div>
    <div class="agent-desc">${esc(T.agents.desc[a.key] || "")}${share ? " " + esc(T.agents.sharesWith(share.name)) : ""}</div>
    <div class="agent-path mono">${esc(T.agents.config)}: ${esc(a.config_path)}</div>
    ${note ? `<div class="agent-note">${esc(note)}</div>` : ""}
    <div class="agent-actions">${btn}${a.connected && a.elsewhere ? `<button class="btn" data-agent="${a.key}" data-act="disconnect">${esc(T.agents.disconnect)}</button>` : ""}</div>
  </div>`;
}
function codeBlock(label, code, id) {
  return `<div class="code-label">${esc(label)}</div><div class="code-block"><pre class="mono" id="${id}">${esc(code)}</pre>
    <button class="btn" data-copy="${id}">${esc(T.agents.copy)}</button></div>`;
}
function renderAgents() {
  if (!agentsData) return;
  const list = agentsData.agents, mine = agentsData.mine || [];
  $("#agents-count").textContent = mine.length;

      <div>${codeBlock(T.agents.fArgs, m.form.args, "snip-f-args")}</div><div>${codeBlock(T.agents.fEnv, T.agents.fEnvEmpty, "snip-f-env")}</div>
    </div>` + codeBlock(T.agents.jsonLabel, m.json, "snip-json") + codeBlock(T.agents.tomlLabel, m.toml, "snip-toml") + codeBlock(T.agents.cmdLabel, m.command, "snip-cmd");
  const lastUse = r => r.last_seen ? T.agents.lastUse(ago(r.last_seen)) : T.agents.neverUsed;
  $("#agents-list").innerHTML = mine.length ? mine.map(r => {
    if (r.source === "config") {
      const a = r.agent;
      return `<div class="conn-row">
      <div><div style="display:flex;gap:8px;align-items:center"><strong>${esc(a.name)}</strong>${agentPill(a)}</div>
        <div class="agent-path mono" style="margin-top:3px">${esc(a.config_path)}</div>
        <div class="${a.elsewhere ? "warn" : "muted"}" style="font-size:12px;margin-top:2px">${esc(a.elsewhere ? T.agents.elsewhereLong : T.agents.here)} · ${esc(lastUse(r))}</div></div>
      <div class="agent-actions">${a.elsewhere ? `<button class="btn primary" data-agent="${a.key}" data-act="connect">${esc(T.agents.reconnect)}</button>` : ""}
        <button class="btn" data-agent="${a.key}" data-act="disconnect">${esc(T.agents.disconnect)}</button></div></div>`;
    }
    const pill = r.source === "seen" ? `<span class="pill st-running">${ICON.check}${esc(T.agents.detected)}</span>` : `<span class="pill st-external">${ICON.dot}${esc(T.agents.manualPill)}</span>`;
    const detail = r.source === "seen" ? T.agents.detectedLong(r.client + (r.version ? ` ${r.version}` : "")) : T.agents.manualLong;
    return `<div class="conn-row">
      <div><div style="display:flex;gap:8px;align-items:center"><strong>${esc(r.name)}</strong>${pill}</div>
        <div class="muted" style="font-size:12px;margin-top:3px">${esc(detail)} · ${esc(lastUse(r))}</div></div>
      <div class="agent-actions"><button class="btn" data-client-rm="${esc(r.id)}">${esc(T.agents.removeFromList)}</button></div></div>`;
  }).join("") : `<div class="empty-chart" style="height:120px">${esc(T.agents.mineEmpty)}</div>`;
  $("#agents-list").querySelectorAll("[data-client-rm]").forEach(b => b.onclick = async () => {
    if (!(await ask(T.agents.removeConfirm, { ok: T.dlg.remove }))) return;
    try { await api("/api/clients/remove", { id: b.dataset.clientRm }); } catch (e) { toast(e.message); }
    loadAgents();
  });
  document.querySelectorAll("[data-agent]").forEach(b => b.onclick = () => agentAction(b.dataset.agent, b.dataset.act, b));
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText($("#" + b.dataset.copy).textContent); b.textContent = T.agents.copied; setTimeout(() => b.textContent = T.agents.copy, 1500); }
    catch (e) { toast(e.message); }
  });
}
async function agentAction(key, act, btn, restart = false) {
  const a = agentsData.agents.find(x => x.key === key);
  if (act === "connect" && a.app_running && !restart) {
    if (!(await ask(T.agents.restartConfirm(a.name), { ok: T.dlg.restart }))) return;
    restart = true;
  }
  btn.disabled = true;
  try {
    const r = await api(`/api/agents/${key}/${act}`, { restart_app: restart });
    if (r.ok) agentNote[key] = act === "connect" ? T.agents.after[key] : T.agents.removed;
    else {
      const e = T.agents.err[r.code];
      agentNote[key] = typeof e === "function" ? e(r.code === "no_cli" ? r.detail : a.name) : `${e || T.agents.err.other} ${r.code === "cli_failed" ? r.detail : ""}`.trim();
    }
  } catch (e) { agentNote[key] = e.message; }
  await loadAgents(); statusRefreshSoon();
}
function statusRefreshSoon() { setTimeout(loadStatus, 300); }
document.querySelectorAll("#agent-tabs .tab").forEach(b => b.onclick = () => { agentTab = b.dataset.tab; renderAgents(); });
$("#client-add-form").onsubmit = async e => {
  e.preventDefault();
  try { await api("/api/clients/add", { name: $("#client-add-name").value }); $("#client-add-name").value = ""; loadAgents(); }
  catch (e2) { toast(e2.message); }
};
async function loadAgents() {
  try { agentsData = await api("/api/agents"); renderAgents(); } catch (e) { /* reintenta */ }
  loadRemote();
}
async function copyText(text, btn, label) {
  try { await navigator.clipboard.writeText(text); btn.textContent = T.agents.copied; setTimeout(() => btn.textContent = label, 1500); }
  catch (e) { toast(e.message); }
}

// ================= acceso remoto por URL (Cloudflare) =================
let remoteData = null, remoteBusy = false, remoteMsg = null;
async function loadRemote() {
  try { remoteData = await api("/api/remote"); } catch (e) { return; }
  renderRemote();
  if (agentsData) renderAgents();
}
function remoteState(r) {
  const t = r.tunnel.status;
  if (t === "running") return "on";
  if (!r.enabled) return "off";  // apagado a propósito: un error viejo del túnel ya no importa
  if (t === "starting" || (r.mcp.status === "starting" && r.enabled)) return "starting";
  if (t === "error" || r.mcp.status === "error") return "error";
  return "off";
}
const remoteErr = r => { const e = T.remote.err[r.code]; return `${e || T.remote.err.other} ${["download", "unsupported_os", "busy", "other"].includes(r.code) || !e ? (r.detail || "") : ""}`.trim(); };
function renderRemote() {
  const r = remoteData, box = $("#remote-card");
  if (!r) return;
  // no pisar lo que el usuario está escribiendo en el formulario del túnel con nombre
  const a = document.activeElement;
  if (box.contains(a) && a.matches("input.input")) return;
  const advOpen = box.querySelector("details.remote-adv")?.open || false;
  // con error sigue "prendido" (enabled): así el switch sirve para apagarlo
  const st = remoteState(r), on = st !== "off";
  const pillCls = { on: "st-running", starting: "st-starting", error: "st-error", off: "st-stopped" }[st];
  const pillIcon = st === "starting" ? statusIcon("starting") : st === "error" ? ICON.alert : st === "on" ? ICON.check : ICON.dot;
  const host = r.url ? new URL(r.url).origin : "";
  const bearerBase = r.base_url ? `${r.base_url.replace(/\/$/, "")}/mcp` : "";
  box.innerHTML = `<div class="card-b">
    <div class="remote-top">
      <div><h2>${esc(T.remote.title)} <span class="sub">· ${esc(T.remote.sub)}</span></h2><p>${esc(T.remote.text)}</p></div>
      <label class="switch ${remoteBusy ? "busy" : ""}" title="${esc(on ? T.remote.off : T.remote.on)}">
        <input type="checkbox" role="switch" id="remote-switch" aria-label="${esc(T.remote.title)}" ${on ? "checked" : ""} ${remoteBusy ? "disabled" : ""}>
        <span class="track"></span></label>
    </div>
    <div class="remote-state"><span class="pill ${pillCls}">${pillIcon}${esc(T.remote.st[st])}</span>
      ${r.cloudflared ? `<span class="mono" style="font-size:12px">${esc(T.remote.cfAt(r.cloudflared))}</span>` : ""}
      ${r.tunnel.managed || st === "error" ? `<button class="btn" type="button" data-logs="tunnel">${ICON.logs}${esc(T.remote.logs)}</button>` : ""}</div>
    ${st === "error" && r.error ? `<div class="src-err mono" style="overflow-wrap:anywhere">${esc(r.error)}</div>` : ""}
    ${!r.cloudflared ? `<div class="remote-row"><span class="muted" style="font-size:13px">${esc(T.remote.noCf)}</span>
      <button class="btn primary" type="button" id="remote-install">${esc(T.remote.install)}</button></div>` : ""}
    ${r.url ? `<div class="remote-url">${codeBlock(T.remote.url, r.url, "remote-url-text")}
      <details><summary class="muted" style="font-size:12.5px;cursor:pointer">${esc(T.remote.bearer)}</summary>
        ${codeBlock(T.remote.bearerUrl, bearerBase, "remote-bearer-url")}${codeBlock(T.remote.bearerHeader, `Authorization: Bearer ${r.token}`, "remote-bearer-h")}</details></div>` : ""}
    <div class="remote-warn">${esc(T.remote.warn)}</div>
    <label class="check"><input type="checkbox" id="remote-ro" ${r.read_only ? "checked" : ""}> <span>${esc(T.remote.readOnly)}</span></label>
    <div class="remote-row"><button class="btn" type="button" id="remote-regen">${esc(T.remote.regenerate)}</button></div>
    <details class="remote-adv" ${advOpen ? "open" : ""}><summary>${esc(T.remote.adv)}</summary>
      <p class="form-hint">${esc(T.remote.quickNote)}</p>

          <button type="button" data-mode="named" class="${r.mode === "named" ? "on" : ""}">${esc(T.remote.modeNamed)}</button></div>
        <p class="form-hint" style="margin:0">${esc(T.remote.namedHelp.replace("{port}", r.port))}</p>

  </div>`;
  box.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyText($("#" + b.dataset.copy).textContent, b, T.agents.copy));

// Login OAuth: la pestaña se abre en el click (si no, el navegador la bloquea) y después se le pone la
// URL del servicio. El dashboard recibe el código en /oauth/callback; acá solo se espera el resultado.
async function connLogin(c, btn) {
  const w = window.open("about:blank", "_blank");
  if (!w) return toast(T.conn.popupBlocked);
  btn.disabled = true; toast(T.conn.loginWaiting);
  try {
    const r = await api(`/api/connections/${c.id}/authorize`, {});
    if (!r.ok) { w.close(); return toast(`${T.conn.loginErr} ${connErr(r)}`); }
    if (r.url) w.location = r.url; else w.close();
    for (let i = 0; i < 200; i++) {  // hasta ~5 minutos
      const s = await api(`/api/connections/${c.id}/auth_status`, {});
      if (s.status === "done") { toast(T.conn.loginOk(s.connection.tools.length)); break; }
      if (s.status === "error") { toast(`${T.conn.loginErr} ${s.error || ""}`); break; }
      await new Promise(res => setTimeout(res, 1500));
    }
  } catch (e) { toast(e.message); }
  finally { btn.disabled = false; loadConnections(); }
}
async function loadConnections() {
  try { connData = await api("/api/connections"); renderConnections(); } catch (e) { /* reintenta */ }
}

const FC_PREF = ["prefer", "corroborate", "orient", "lead_only", "exclude"];
["#fc-level", "#fc-fresh", "#fc-provider"].forEach(id => BrainUI.select($(id)));
function fcStatic() {
  const F = T.fc;
  $("#fc-text").placeholder = F.textPh;
  $("#fc-prov-conn").textContent = F.connOpt; $("#fc-conn-help").textContent = F.connHelp; BrainUI.sync($("#fc-provider"));
  $("#fc-brave").placeholder = F.braveKey;
  [...$("#fc-level").options].forEach(o => { o.textContent = F.levels[o.value][0]; o.dataset.sub = F.levels[o.value][1]; });
  [...$("#fc-fresh").options].forEach(o => o.textContent = F.freshOpts[o.value]);
  BrainUI.sync($("#fc-level")); BrainUI.sync($("#fc-fresh"));
  if (fcPrefs) fcFill(fcPrefs);
  if (fcReport) fcRender(fcReport);
}
async function loadFactcheck() {
  try { const r = await api("/api/factcheck/prefs"); fcPrefs = r.prefs; fcDefaults = r.defaults; } catch (e) { return; }
  fcStatic(); fcFill(fcPrefs); loadFcHistory();
}
function fcFill(p) {
  const F = T.fc;
  $("#fc-level").value = p.level; $("#fc-fresh").value = p.freshness; $("#fc-provider").value = p.provider;
  BrainUI.sync($("#fc-level")); BrainUI.sync($("#fc-fresh")); BrainUI.sync($("#fc-provider"));
  $("#fc-level-help").textContent = F.levels[p.level][1];
  $("#fc-dates").hidden = p.freshness !== "custom"; $("#fc-from").value = p.fresh_from || ""; $("#fc-to").value = p.fresh_to || "";
  $("#fc-primary").checked = p.require_primary; $("#fc-counter").checked = p.counterevidence;
  $("#fc-min").value = p.min_sources; $("#fc-max").value = p.max_sources;
  const custom = p.level === "custom";
  ["#fc-primary", "#fc-counter", "#fc-min", "#fc-max"].forEach(id => $(id).disabled = !custom);
  $("#fc-types").innerHTML = FC_TYPES.map(t => `<label class="check"><input type="checkbox" data-fct="${t}" ${p.claim_types.includes(t) ? "checked" : ""}> <span>${esc(F.types[t])}</span></label>`).join("");
  $("#fc-topics").innerHTML = FC_TOPICS.map(t => `<label class="check"><input type="checkbox" data-fctopic="${t}" ${p.high_risk_topics.includes(t) ? "checked" : ""}> <span>${esc(F.topics[t])}</span></label>`).join("");
  $("#fc-risk").checked = p.always_high_risk;
  $("#fc-regions").value = p.regions.join(", "); $("#fc-langs").value = p.languages.join(", ");
  $("#fc-foreign").checked = p.allow_foreign; $("#fc-local").checked = p.prefer_local;
  $("#fc-sp").innerHTML = FC_SRC.map(t => `<span>${esc(F.src[t])}</span><select class="input full" data-fcsp="${t}">${FC_PREF.map(v => `<option value="${v}" ${p.source_prefs[t] === v ? "selected" : ""}>${esc(F.pref[v])}</option>`).join("")}</select>`).join("");
  $("#fc-sp").querySelectorAll("select").forEach(sel => BrainUI.select(sel));
  $("#fc-searxng").value = p.searxng_url || ""; $("#fc-brave").value = "";
  $("#fc-conn-args").value = p.connection_args && Object.keys(p.connection_args).length ? JSON.stringify(p.connection_args) : "";
  fcProvider();
  $("#fc-blocked").value = p.blocked_domains.join("\n");
  $("#fc-enabled").checked = p.enabled; $("#fc-auto").checked = p.chat_auto;
  $("#fc-web").checked = p.enabled; $("#fc-web").disabled = !p.enabled;
  $("#fc-prefs-when").textContent = p.updated_at ? F.updated(ago(p.updated_at)) : F.defaultsOn;
}
let fcTools = [];
async function loadFcTools() {
  try { fcTools = (await api("/api/factcheck/tools")).tools; } catch (e) { fcTools = []; }
  const sel = $("#fc-conn-tool"), cur = fcPrefs ? fcPrefs.connection_tool : "";
  sel.innerHTML = fcTools.length ? fcTools.map(t => `<option value="${esc(t.name)}" data-sub="${esc(t.description)}" ${t.name === cur ? "selected" : ""}>${esc(t.name)}</option>`).join("")
    : `<option value="">${esc(T.fc.connNone)}</option>`;
  if (cur && !fcTools.some(t => t.name === cur)) sel.insertAdjacentHTML("afterbegin", `<option value="${esc(cur)}" selected>${esc(cur)} (${esc(T.fc.connGone)})</option>`);
  if (!sel._bui) { BrainUI.select(sel); sel._bui = true; } else BrainUI.sync(sel);
}
function fcProvider() {
  const v = $("#fc-provider").value;
  $("#fc-searxng").hidden = v !== "searxng"; $("#fc-brave").hidden = v !== "brave"; $("#fc-conn").hidden = v !== "connection";
  if (v === "connection") loadFcTools();
  $("#fc-brave").placeholder = fcPrefs && fcPrefs.has_brave_key ? T.fc.braveSaved : T.fc.braveKey;
}
$("#fc-provider").onchange = fcProvider;
$("#fc-fresh").onchange = () => { $("#fc-dates").hidden = $("#fc-fresh").value !== "custom"; };
$("#fc-level").onchange = () => {
  const v = $("#fc-level").value, preset = fcDefaults && v !== "custom" ? T.fc.presets[v] : null;
  $("#fc-level-help").textContent = T.fc.levels[v][1];
  if (preset) { $("#fc-min").value = preset[0]; $("#fc-max").value = preset[1]; $("#fc-primary").checked = preset[2]; $("#fc-counter").checked = preset[3]; }
  ["#fc-primary", "#fc-counter", "#fc-min", "#fc-max"].forEach(id => $(id).disabled = v !== "custom");
};
function fcCollect() {
  const body = {
    level: $("#fc-level").value, freshness: $("#fc-fresh").value, fresh_from: $("#fc-from").value, fresh_to: $("#fc-to").value,
    require_primary: $("#fc-primary").checked, counterevidence: $("#fc-counter").checked,
    min_sources: +$("#fc-min").value, max_sources: +$("#fc-max").value,
    claim_types: [...document.querySelectorAll("[data-fct]:checked")].map(x => x.dataset.fct),
    high_risk_topics: [...document.querySelectorAll("[data-fctopic]:checked")].map(x => x.dataset.fctopic),
    always_high_risk: $("#fc-risk").checked, regions: $("#fc-regions").value, languages: $("#fc-langs").value,
    allow_foreign: $("#fc-foreign").checked, prefer_local: $("#fc-local").checked,
    source_prefs: Object.fromEntries([...document.querySelectorAll("[data-fcsp]")].map(x => [x.dataset.fcsp, x.value])),
    provider: $("#fc-provider").value, searxng_url: $("#fc-searxng").value, blocked_domains: $("#fc-blocked").value,
    connection_tool: $("#fc-conn-tool").value, connection_args: $("#fc-conn-args").value,
    enabled: $("#fc-enabled").checked, chat_auto: $("#fc-auto").checked,
  };
  if ($("#fc-brave").value.trim()) body.brave_key = $("#fc-brave").value.trim();
  return body;
}
async function fcSave(body, okText) {
  const out = $("#fc-prefs-result");
  try {
    const r = await api("/api/factcheck/prefs", body);
    if (!r.ok) return showResult(out, "err", T.fc.err[r.code] || r.detail || r.code);
    fcPrefs = r.prefs; fcFill(fcPrefs); showResult(out, "ok", okText);
  } catch (e) { showResult(out, "err", e.message); }
}
$("#fc-save").onclick = () => fcSave(fcCollect(), T.fc.saved);
$("#fc-reset").onclick = () => fcSave({ reset: true }, T.fc.resetDone);

async function loadFcHistory() {
  let r; try { r = await api("/api/factcheck/reports"); } catch (e) { return; }
  $("#fc-hist").innerHTML = r.reports.map(x => `<li><button class="link" type="button" data-fcopen="${esc(x.id)}" title="${esc(x.input)}">${esc(x.input)}</button>
    <span class="when">${esc(x.verdicts.map(v => T.fc.vShort[v] || "·").join(" "))} · ${esc(ago(x.created_at))}</span></li>`).join("") || `<li class="muted">${esc(T.fc.noHistory)}</li>`;
  $("#fc-hist").querySelectorAll("[data-fcopen]").forEach(b => b.onclick = () => openFcReport(b.dataset.fcopen));
}
async function openFcReport(id) {
  try { const r = await api(`/api/factcheck/report?id=${encodeURIComponent(id)}`); if (r.ok) { fcReport = r.report; fcReport._md = r.markdown; fcRender(fcReport); $("#fc-report").scrollIntoView({ behavior: "smooth", block: "start" }); } }
  catch (e) { toast(e.message); }
}

function fcStepText(ev) {
  const F = T.fc.steps;
  if (ev.step === "claims") return F.claims;
  if (ev.step === "local") return F.local(ev.i + 1);
  if (ev.step === "search") return F.search(ev.i + 1, (ev.reason || []).map(r => T.fc.reasons[r] || r).join(", "));
  if (ev.step === "read") return F.read(ev.n);
  if (ev.step === "source") return F.source(ev.url, T.fc.stance[ev.stance] || ev.stance);
  if (ev.step === "verdict") return F.verdict(ev.i + 1);
  return ev.step;
}
$("#fc-form").onsubmit = async e => {
  e.preventDefault();
  if (fcBusy) { if (fcCtl) fcCtl.abort(); return; }
  const text = $("#fc-text").value.trim();
  if (!text) return;
  fcBusy = true; $("#fc-btn").textContent = T.fc.stop; $("#fc-result").className = "result";
  const steps = $("#fc-steps"); steps.hidden = false; steps.innerHTML = "";
  fcReport = { claims: [], input: text, live: true }; fcRender(fcReport);
  fcCtl = new AbortController();
  try {
    const r = await fetch("/api/factcheck/run", { method: "POST", signal: fcCtl.signal, headers: { "Content-Type": "application/json", "X-Brain": "1" },
      body: JSON.stringify({ text, lang, web: $("#fc-web").checked }) });
    if (!r.ok || !r.body) throw new Error(`HTTP ${r.status}`);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === "step") {
          steps.querySelectorAll("li.now").forEach(li => li.classList.remove("now"));
          steps.insertAdjacentHTML("beforeend", `<li class="now">${esc(fcStepText(ev))}</li>`);
        } else if (ev.type === "claim") { fcReport.claims.push(ev.claim); fcRender(fcReport); }
        else if (ev.type === "done") { fcReport = ev.report; fcRender(fcReport); steps.hidden = true; loadFcHistory(); }
        else if (ev.type === "error") showResult($("#fc-result"), "err", T.fc.err[ev.code] || ev.detail || ev.code);
      }
    }
  } catch (err) { if (err.name !== "AbortError") showResult($("#fc-result"), "err", err.message); }
  finally { fcBusy = false; fcCtl = null; $("#fc-btn").textContent = T.fc.run; steps.querySelectorAll("li.now").forEach(li => li.classList.remove("now")); }
};

function fcSource(s) {
  const F = T.fc, tags = [`<span class="fc-tag">${esc(F.src[s.type] || s.type)}</span>`];
  if (s.primary) tags.push(`<span class="fc-tag">${esc(F.sig.primary)}</span>`);
  tags.push(`<span class="fc-tag ${s.author ? "" : "bad"}">${esc(s.author ? F.sig.author(s.author) : F.sig.noAuthor)}</span>`);
  tags.push(`<span class="fc-tag ${s.date ? "" : "bad"}">${esc(s.date ? F.sig.date(s.date) : F.sig.noDate)}</span>`);
  if (s.stale) tags.push(`<span class="fc-tag bad">${esc(F.sig.stale)}</span>`);
  if (s.republished) tags.push(`<span class="fc-tag bad">${esc(F.sig.republished)}</span>`);
  if (s.origin === "web" && !s.inspected) tags.push(`<span class="fc-tag bad">${esc(F.sig.notInspected)}</span>`);
  if (s.pref === "lead_only") tags.push(`<span class="fc-tag">${esc(F.sig.lead)}</span>`);
  if (s.same_scope === false) tags.push(`<span class="fc-tag bad">${esc(F.sig.scope)}</span>`);
  tags.push(`<span class="fc-tag">${esc(s.origin === "brain" ? F.sig.brain : F.sig.web)}</span>`);
  const where = s.url || s.path, title = s.title || where;
  const link = s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a>` : `<b>${esc(title)}</b>`;
  const acts = s.origin === "web" ? `<div class="acts"><button class="btn" type="button" data-fcsave="${esc(s.url)}">${esc(F.saveSrc)}</button>
    <button class="btn" type="button" data-fcblock="${esc(s.sitename && s.sitename.includes(".") ? s.sitename : (new URL(s.url)).hostname)}">${esc(F.block)}</button></div>` : "";
  return `<div class="fc-src">${link} <span class="muted">· ${esc(s.sitename || "")} · ${esc(F.lineN(s.group))}</span>
    <div class="tags">${tags.join("")}</div>${s.quote ? `<blockquote>${esc(s.quote)}</blockquote>` : ""}
    ${s.explanation ? `<div>${esc(s.explanation)}</div>` : ""}${s.error ? `<div class="muted">${esc(s.error)}</div>` : ""}${acts}</div>`;
}
function fcRender(r) {
  const F = T.fc, box = $("#fc-report");
  if (!r) { box.innerHTML = ""; return; }
  const banners = [];
  if (r.went_web) banners.push(`<div class="fc-banner">${esc(F.wentWeb)}</div>`);
  if ((r.notes || []).includes("web_off")) banners.push(`<div class="fc-banner">${esc(F.webOff)}</div>`);
  if ((r.notes || []).includes("no_model")) banners.push(`<div class="fc-banner warn">${esc(F.noModel)}</div>`);
  if ((r.notes || []).includes("high_risk") || r.claims.some(c => c.risk === "high")) banners.push(`<div class="fc-banner warn">${esc(F.highRisk)}</div>`);
  const claims = r.claims.map(c => {
    const groups = { supports: [], contradicts: [], supports_with_limits: [], other: [] };
    (c.sources || []).forEach(s => (groups[s.stance] || groups.other).push(s));
    const sec = (k, list) => list.length ? `<div class="fc-group-h">${esc(F.groups[k])} · ${list.length}</div>${list.map(fcSource).join("")}` : "";
    const lines = c.lines ? F.lines(c.lines.support, c.lines.contra, c.lines.limits || 0) : "";
    const from = c.decision ? F.decision[c.decision] + (c.reason && c.reason.length && c.decision !== "local" ? ` (${c.reason.map(x => F.reasons[x] || x).join(", ")})` : "") : "";
    return `<div class="card fc-claim"><div class="card-b">
      <h3>${esc(c.text)}</h3>
      <span class="fc-v ${esc(c.verdict)}">${esc(F.v[c.verdict] || c.verdict)}</span>
      <div class="fc-meta">${esc([F.types[c.type] || c.type, c.risk === "high" ? F.riskHigh : "", lines].filter(Boolean).join(" · "))}</div>
      ${c.explanation ? `<p>${esc(c.explanation)}</p>` : ""}
      ${c.subclaims && c.subclaims.length ? `<p><b>${esc(F.parts)}:</b> ${esc(c.subclaims.join(" · "))}</p>` : ""}
      ${from ? `<div class="fc-meta">${esc(from)}</div>` : ""}${c.search_error ? `<div class="fc-meta" style="color:var(--bad)">${esc(F.searchError(c.search_error))}</div>` : ""}
      ${sec("supports", groups.supports)}${sec("contradicts", groups.contradicts)}${sec("supports_with_limits", groups.supports_with_limits)}
      ${groups.other.length ? `<details><summary class="fc-group-h" style="cursor:pointer">${esc(F.groups.other)} · ${groups.other.length}</summary>${groups.other.map(fcSource).join("")}</details>` : ""}
      ${(c.limitations || []).length ? `<div class="fc-group-h">${esc(F.limits)}</div><ul class="fc-lims">${c.limitations.map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}
    </div></div>`;
  }).join("");
  const acts = r.id && !r.live ? `<div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" type="button" id="fc-copy">${esc(F.copy)}</button>
    <button class="btn" type="button" id="fc-again">${esc(F.again)}</button>
    <button class="btn" type="button" id="fc-del" style="color:var(--bad)">${esc(F.del)}</button></div>` : "";
  box.innerHTML = r.claims.length || banners.length ? `<div class="fc-rep">${banners.join("")}${claims}${acts}</div>` : "";
  box.querySelectorAll("[data-fcsave]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const x = await api("/api/factcheck/save_source", { url: b.dataset.fcsave }); toast(x.ok ? F.savedSrc(x.path) : (T.err[x.code] || x.detail || x.code)); }
    catch (e) { toast(e.message); } finally { b.disabled = false; }
  });
  box.querySelectorAll("[data-fcblock]").forEach(b => b.onclick = async () => {
    if (!(await ask(F.blockConfirm(b.dataset.fcblock), { ok: F.block }))) return;
    try { const x = await api("/api/factcheck/block", { domain: b.dataset.fcblock }); if (x.ok) { fcPrefs = x.prefs; fcFill(fcPrefs); toast(F.blocked(b.dataset.fcblock)); } }
    catch (e) { toast(e.message); }
  });
  if ($("#fc-copy")) $("#fc-copy").onclick = async () => {
    let md = r._md; if (!md) { try { md = (await api(`/api/factcheck/report?id=${encodeURIComponent(r.id)}`)).markdown; } catch (e) { return toast(e.message); } }
    copyText(md, $("#fc-copy"), F.copy);
  };
  if ($("#fc-again")) $("#fc-again").onclick = () => { $("#fc-text").value = r.input; $("#fc-form").requestSubmit(); };
  if ($("#fc-del")) $("#fc-del").onclick = async () => {
    if (!(await ask(F.delConfirm, { ok: T.dlg.del, danger: true }))) return;
    try { await api("/api/factcheck/delete", { id: r.id }); fcReport = null; fcRender(null); loadFcHistory(); } catch (e) { toast(e.message); }
  };
}
</script>
