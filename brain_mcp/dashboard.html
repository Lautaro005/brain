<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Courier+Prime:wght@400;700&display=swap">
<script src="/ui.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #ececea; --surface: #ffffff; --surface-2: #f5f5f3; --line: #e3e3e0; --line-strong: #cfcfcc;
    --text: #0a0a0a; --text-2: #3d3d3d; --text-3: #5e5e5e;
    --accent: #0a0a0a; --accent-soft: #e6e6e3; --accent-ink: #0a0a0a;
    --bar: #0a0a0a; --bar-hover: #5e5e5e; --grid: #ececea;
    --good: #0a0a0a; --good-soft: #e6e6e3; --warn: #3d3d3d; --warn-soft: #efefec;
    --bad: #b42318; --bad-soft: #fbeae8; --idle: #5e5e5e; --idle-soft: #efefec;
    --shadow: 0 1px 0 rgba(10,10,10,.06), 0 3px 5px -2px rgba(10,10,10,.12);
    --radius: 4px; --memory: #0a0a0a; --bui-radius: 4px; --bui-btn-radius: 3px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f0f0e; --surface: #191918; --surface-2: #222221; --line: #2a2a29; --line-strong: #3a3a38;
      --text: #f2f2f0; --text-2: #c8c8c4; --text-3: #9a9a95;
      --accent: #f2f2f0; --accent-soft: #2a2a29; --accent-ink: #f2f2f0;
      --bar: #f2f2f0; --bar-hover: #9a9a95; --grid: #232322;
      --good: #f2f2f0; --good-soft: #2a2a29; --warn: #c8c8c4; --warn-soft: #232322;
      --bad: #f07167; --bad-soft: #3a1d1a; --idle: #9a9a95; --idle-soft: #232322;
      --shadow: 0 1px 0 rgba(0,0,0,.4), 0 3px 6px -2px rgba(0,0,0,.5); --memory: #f2f2f0;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
      --bg: #0f0f0e; --surface: #191918; --surface-2: #222221; --line: #2a2a29; --line-strong: #3a3a38;
      --text: #f2f2f0; --text-2: #c8c8c4; --text-3: #9a9a95;
      --accent: #f2f2f0; --accent-soft: #2a2a29; --accent-ink: #f2f2f0;
      --bar: #f2f2f0; --bar-hover: #9a9a95; --grid: #232322;
      --good: #f2f2f0; --good-soft: #2a2a29; --warn: #c8c8c4; --warn-soft: #232322;
      --bad: #f07167; --bad-soft: #3a1d1a; --idle: #9a9a95; --idle-soft: #232322;
      --shadow: 0 1px 0 rgba(0,0,0,.4), 0 3px 6px -2px rgba(0,0,0,.5); --memory: #f2f2f0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
  button, input { font: inherit; color: inherit; }
  a { color: var(--accent); text-decoration: none; }
  .mono { font-family: "Courier Prime", "Courier New", monospace; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  nav.side { position: sticky; top: 0; height: 100vh; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px;
    border-right: 1px solid var(--line); background: var(--surface); }
  .logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; font-weight: 700; font-size: 16px; letter-spacing: -.02em; }
  .logo-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--text); color: var(--surface); display: grid; place-items: center; }
  .logo small { display: block; font-weight: 500; font-size: 11.5px; color: var(--text-3); letter-spacing: 0; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--text-2);
    cursor: pointer; font-weight: 500; border: 0; background: none; text-align: left; width: 100%; }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent-ink); }
  .nav-item svg { width: 17px; height: 17px; flex: none; }
  .side-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line); display: grid; gap: 7px; }
  .side-svc { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); }
  .side-svc .dot { width: 7px; height: 7px; border-radius: 50%; }

  main { padding: 28px 36px 60px; min-width: 0; }
  header.page { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  header.page h1 { margin: 0; font-size: 24px; letter-spacing: -.025em; font-weight: 650; }
  header.page p { margin: 2px 0 0; color: var(--text-3); font-size: 13px; }
  .updated { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 var(--good); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 50%, transparent); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  section.view { display: none; }
  section.view.active { display: block; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 16px 18px 0; }
  .card-h h2 { margin: 0; font-size: 13.5px; font-weight: 600; letter-spacing: -.005em; }
  .card-h .sub { font-size: 12px; color: var(--text-3); }
  .card-b { padding: 14px 18px 18px; }
  .grid { display: grid; gap: 16px; }
  .section-title { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin: 28px 0 10px; }
  .section-title:first-child { margin-top: 0; }

  /* ---------- servicios ---------- */
  .services { grid-template-columns: repeat(3, 1fr); }
  .svc { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .svc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .svc-name { font-weight: 600; font-size: 14.5px; }
  .svc-desc { color: var(--text-3); font-size: 12.5px; margin-top: 1px; }
  .svc-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--text-3); }
  .svc-actions { display: flex; gap: 8px; margin-top: auto; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px 2px 6px; border-radius: 999px; }
  .pill svg { width: 12px; height: 12px; }
  .st-running { color: var(--good); background: var(--good-soft); }
  .st-external { color: var(--accent-ink); background: var(--accent-soft); }
  .st-starting { color: var(--warn); background: var(--warn-soft); }
  .st-stopped { color: var(--idle); background: var(--idle-soft); }
  .st-error { color: var(--bad); background: var(--bad-soft); }

  .switch { position: relative; width: 40px; height: 23px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
  .switch input:disabled { cursor: not-allowed; }
  .switch .track { position: absolute; inset: 0; border-radius: 999px; background: var(--line-strong); transition: background .18s; }
  .switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .18s cubic-bezier(.3,.7,.4,1); }
  .switch input:checked + .track { background: var(--good); }
  .switch input:checked + .track::after { transform: translateX(17px); }
  .switch input:disabled + .track { opacity: .55; }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .switch.busy .track::after { animation: blink .8s infinite alternate; }
  @keyframes blink { to { opacity: .4; } }

  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
    padding: 6px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 500; cursor: pointer; color: var(--text-2); }
  .btn:hover { border-color: var(--line-strong); color: var(--text); }
  .btn.primary { background: var(--text); color: var(--surface); border-color: var(--text); }
  .btn.primary:hover { opacity: .88; }
  .btn:disabled { opacity: .5; cursor: progress; }
  .btn svg { width: 14px; height: 14px; }

  /* ---------- KPIs ---------- */
  .kpis { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
  .kpi { padding: 14px 16px; }
  .kpi .label { font-size: 12px; color: var(--text-3); font-weight: 500; }
  .kpi .value { font-size: 26px; font-weight: 650; letter-spacing: -.03em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .value.na { color: var(--text-3); font-size: 20px; }
  .kpi .foot { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }

  /* ---------- charts ---------- */
  .charts { grid-template-columns: 2fr 1fr; }
  .charts .wide { grid-column: 1 / -1; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart .axis text { font-size: 11px; fill: var(--text-3); font-variant-numeric: tabular-nums; }
  .chart .grid-line { stroke: var(--grid); stroke-width: 1; }
  .chart .baseline { stroke: var(--line-strong); stroke-width: 1; }
  .chart .bar { fill: var(--bar); transition: fill .12s; }
  .chart .bar.hi { fill: var(--bar-hover); }
  .chart .hbar-label { font-size: 12.5px; fill: var(--text-2); }
  .chart .hbar-value { font-size: 12px; fill: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .chart .track { fill: var(--surface-2); }
  .empty-chart { height: 150px; display: grid; place-items: center; color: var(--text-3); font-size: 13px; text-align: center; padding: 0 20px; }
  .tip { position: fixed; pointer-events: none; z-index: 50; background: var(--text); color: var(--surface); font-size: 12px;
    padding: 6px 9px; border-radius: 7px; opacity: 0; transform: translate(-50%, calc(-100% - 10px)); transition: opacity .1s; white-space: nowrap; }
  .tip b { font-weight: 650; }
  .table-toggle { font-size: 12px; color: var(--text-3); background: none; border: 0; cursor: pointer; padding: 0; }
  .table-toggle:hover { color: var(--text); }
  table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 10px; }
  table.data th { text-align: left; color: var(--text-3); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.data td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.data tr:last-child td { border-bottom: 0; }

  /* ---------- salud y actividad ---------- */
  .two { grid-template-columns: 1fr 1fr; }
  .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .checks li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .checks li:last-child { border-bottom: 0; }
  .checks .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .checks .ic svg { width: 12px; height: 12px; }
  .checks .ok .ic { background: var(--good-soft); color: var(--good); }
  .checks .no .ic { background: var(--bad-soft); color: var(--bad); }
  .checks .lbl { font-weight: 500; }
  .checks .state { margin-left: auto; font-size: 12px; color: var(--text-3); text-align: right; }
  .checks .no .state { color: var(--bad); }
  .commits { list-style: none; margin: 0; padding: 0; }
  .commits li { display: grid; grid-template-columns: 76px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .commits li:last-child { border-bottom: 0; }
  .op { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 5px; text-align: center; background: var(--surface-2); color: var(--text-2); }
  .commits .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .commits .when { color: var(--text-3); font-size: 11.5px; white-space: nowrap; }
  .muted { color: var(--text-3); }

  /* ---------- grafo ---------- */
  .graph-frame { width: 100%; height: calc(100vh - 150px); min-height: 480px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
  .graph-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  /* el chat ocupa toda el área de trabajo, sin encabezado ni tarjeta: una sola superficie con el sidebar */
  body.on-chat main { padding: 0; background: var(--surface); }
  .chat-frame { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; }
  @media (max-width: 760px) { .chat-frame { height: calc(100dvh - 150px); min-height: 480px; } }

  /* ---------- conocimiento ---------- */
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .input { flex: 1; min-width: 220px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; outline: none; }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .check { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-2); cursor: pointer; user-select: none; }
  .check input { accent-color: var(--accent); }
  .result { margin-top: 12px; padding: 10px 12px; border-radius: 9px; font-size: 13px; display: none; align-items: flex-start; gap: 8px; }
  .result.show { display: flex; }
  .result.ok { background: var(--good-soft); color: var(--good); }
  .result.err { background: var(--bad-soft); color: var(--bad); }
  .result.info { background: var(--surface-2); color: var(--text-2); }
  .result svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }
  .hits { display: grid; gap: 10px; margin-top: 14px; }
  .hit { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .hit-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 12px; color: var(--text-3); }
  .score { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; color: var(--text-2); font-weight: 600; }
  .score-bar { width: 60px; height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .score-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .hit p { margin: 0; font-size: 13px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- logs ---------- */
  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 10px; width: fit-content; margin-bottom: 12px; }
  .tab { border: 0; background: none; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-weight: 500; font-size: 13px; color: var(--text-2); display: inline-flex; align-items: center; gap: 7px; }
  .tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; }
  pre.logs { margin: 0; height: calc(100vh - 220px); min-height: 360px; overflow: auto; padding: 16px 18px; font-size: 12px; line-height: 1.6;
    background: #111110; color: #d9d8d2; border-radius: var(--radius); border: 1px solid var(--line); white-space: pre-wrap; word-break: break-all; }
  pre.logs .cmd { color: #ffffff; font-weight: 700; }
  pre.logs .end { color: #b4b4b0; font-style: italic; }

  .toast { position: fixed; bottom: 20px; right: 20px; z-index: 60; background: var(--text); color: var(--surface); padding: 10px 14px;
    border-radius: 10px; font-size: 13px; max-width: 420px; box-shadow: 0 6px 24px rgba(0,0,0,.2); opacity: 0; transform: translateY(8px); transition: .2s; }
  .toast.show { opacity: 1; transform: none; }

  @media (max-width: 1100px) { .services { grid-template-columns: 1fr 1fr; } .charts, .two { grid-template-columns: 1fr; } }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    nav.side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; }
    .logo { padding: 0 8px 0 0; width: 100%; }
    .nav-item { width: auto; }
    /* en celular el pie queda arriba de la página: tema, idioma, servicios (i) y Ajustes */
    .side-foot { width: 100%; margin: 6px 0 0; padding: 8px 0 0; }
    .side-tools { margin-top: 0; }
    main { padding: 20px 16px 40px; }
    .services { grid-template-columns: 1fr; }
  }

  /* ---------- sidebar: ajustes (tema + idioma) ---------- */
  .side-tools { display: flex; gap: 6px; margin-top: 8px; }
  .icon-btn { height: 30px; min-width: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
    color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }
  .icon-btn:hover { color: var(--text); border-color: var(--line-strong); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .icon-btn svg { width: 15px; height: 15px; }

  /* ---------- perfil ---------- */
  .field { display: grid; gap: 5px; margin-bottom: 12px; }
  .field label { font-size: 12.5px; font-weight: 500; color: var(--text-2); }
  textarea.input { min-height: 110px; resize: vertical; line-height: 1.5; font: inherit; width: 100%; }
  .input.full { width: 100%; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 650; font-size: 16px; flex: none; }
  .profile-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .profile-head .n { font-weight: 600; font-size: 15px; }
  .profile-head .h { color: var(--text-3); font-size: 12.5px; }
  .steps { display: grid; gap: 18px; }
  .step-t { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; margin-bottom: 8px; }
  .step-n { width: 20px; height: 20px; border-radius: 50%; background: var(--text); color: var(--surface); font-size: 11px; display: grid; place-items: center; flex: none; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer;
    font-size: 12.5px; font-weight: 500; color: var(--text-2); }
  .seg button.on { background: var(--text); color: var(--surface); border-color: var(--text); }
  .prompt-box { position: relative; background: var(--surface-2); border-radius: 9px; padding: 12px 14px; font-size: 12.5px;
    color: var(--text-2); white-space: pre-wrap; line-height: 1.55; max-height: 160px; overflow: auto; }
  .prompt-actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .file-btn { position: relative; overflow: hidden; }
  .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .preview { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; }
  .preview-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .preview-b { max-height: 320px; overflow: auto; padding: 4px 12px 10px; }
  .mem-cat { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .mem-cat:last-child { border-bottom: 0; }
  .mem-cat-h { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .count { font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); }
  .src { font-size: 11px; color: var(--text-3); font-weight: 500; }
  .mem-items { list-style: none; margin: 0; padding: 0; }
  .mem-items li { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; font-size: 13px; color: var(--text-2); }
  .mem-items li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--text); margin-top: 8px; flex: none; }
  .mem-items li span { flex: 1; }
  .x-btn { border: 0; background: none; color: var(--text-3); cursor: pointer; padding: 2px 4px; border-radius: 5px; line-height: 1; font-size: 15px; }
  .x-btn:hover { color: var(--bad); background: var(--bad-soft); }
  .mem-list { max-height: 560px; overflow: auto; }
  .reflect-list { display: grid; gap: 10px; margin-top: 12px; }
  .reflect-item { border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; font-size: 13.5px; }
  .reflect-item .code-label { margin-bottom: 4px; }
  .reflect-item code { display: block; margin-top: 8px; font: 12px/1.45 "Courier Prime", monospace; white-space: pre-wrap; word-break: break-word; color: var(--text-2); }
  .kw-tag { font: 700 11px/1.3 "Courier Prime", monospace; letter-spacing: .05em; text-transform: uppercase; color: var(--text-2); border: 1px solid var(--line-strong); border-radius: 3px; padding: 1px 6px; }

  /* ---------- conectar agente ---------- */
  .agents { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .agent { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .agent-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .agent-name { font-weight: 600; font-size: 14.5px; }
  .agent-desc { color: var(--text-3); font-size: 12.5px; }
  .agent-path { font-size: 11.5px; color: var(--text-3); word-break: break-all; }
  .agent-note { font-size: 12px; color: var(--text-2); background: var(--surface-2); border-radius: 8px; padding: 7px 10px; }
  .agent-actions { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }
  .st-none { color: var(--idle); background: var(--idle-soft); }
  .code-block { position: relative; margin: 6px 0 14px; }
  .code-block pre { margin: 0; background: #111110; color: #d9d8d2; border-radius: 9px; padding: 12px 14px; font-size: 12px; overflow-x: auto; white-space: pre; }
  .code-block .btn { position: absolute; top: 8px; right: 8px; padding: 3px 9px; font-size: 11.5px; }
  .code-label { font-size: 12px; font-weight: 600; color: var(--text-2); }
  .conn-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .conn-row:last-child { border-bottom: 0; }
  .conn-row .warn { color: var(--warn); font-size: 12px; }
  .tab .count { margin-left: 2px; }

  /* ---------- conexiones ---------- */
  .conns-list { display: grid; gap: 12px; }
  .conn { display: grid; gap: 10px; padding: 14px 16px; }
  .conn.off { background: var(--surface-2); }
  .conn.off .conn-name { color: var(--text-3); }
  .conn-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .conn-name { font-weight: 700; font-size: 15px; }
  .conn-meta { font: 400 12.5px/1.4 "Courier Prime", monospace; color: var(--text-3); word-break: break-all; }
  .conn-sw { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .conn-sw label.lbl { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); cursor: pointer; }
  .tool-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .tool-chips span { font: 400 11.5px/1 "Courier Prime", monospace; padding: 4px 6px; border: 1px solid var(--line-strong); border-radius: 3px; color: var(--text-2); }
  .conn-err { font-size: 12.5px; color: var(--bad); }
  .conn-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  [hidden] { display: none !important; }
  textarea.mono, input.mono { font-family: "Courier Prime", "Courier New", monospace; font-size: 13.5px; }
  .form-hint { font-size: 12.5px; color: var(--text-3); margin: 6px 0 0; }
  .notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 3px; font-size: 13px; color: var(--text-2); background: var(--surface-2); }
  .notice svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
  .ac-list { display: grid; gap: 2px; max-height: 260px; overflow: auto; margin: 10px 0; }
  .ac-list label { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-bottom: 1px solid var(--line); font-size: 13.5px; cursor: pointer; }
  .ac-list .tk { margin-left: auto; font: 400 12px/1 "Courier Prime", monospace; color: var(--text-3); }
  .kind-stamp { font: 700 10.5px/1.5 "Courier Prime", monospace; letter-spacing: .1em; text-transform: uppercase; border: 1.5px solid currentColor; border-radius: 3px; padding: 0 6px; font-size: 11px; }
  .install-path { font-size: 12.5px; color: var(--text-3); margin: -4px 0 10px; }
  @media (max-width: 760px) { .form-grid { grid-template-columns: 1fr; } .conn-sw { margin-left: 0; } }

  /* =====================================================================
     Sistema "fichero" (el de la landing, DESIGN.md) en versión de trabajo:
     monocromo, Archivo para la interfaz, Courier Prime solo para etiquetas,
     referencias y código; rojo reservado para errores y acciones destructivas.
     ===================================================================== */
  body { font: 400 14.5px/1.5 "Archivo", "Helvetica Neue", Arial, sans-serif; font-feature-settings: normal; }
  .mono, code, pre { font-family: "Courier Prime", "Courier New", monospace; }
  a { color: var(--text); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  ::selection { background: var(--text); color: var(--surface); }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  html { scrollbar-color: var(--line-strong) var(--bg); }

  .logo { font: 800 20px/1 "Archivo", sans-serif; font-stretch: 86%; letter-spacing: -.03em; gap: 9px; }
  .logo small { font: 400 11.5px/1.3 "Courier Prime", monospace; letter-spacing: 0; margin-top: 3px; }
  .logo-mark { width: auto; height: auto; background: none; color: var(--text); border-radius: 0; }
  .nav-item { border-radius: 3px; font-weight: 600; }
  .nav-item.active, .nav-item.active:hover { background: var(--text); color: var(--surface); }

  header.page h1 { font: 800 34px/1 "Archivo", sans-serif; font-stretch: 84%; letter-spacing: -.03em; }
  header.page p { font-size: 13.5px; color: var(--text-2); margin-top: 6px; }
  .section-title { font: 700 11.5px/1 "Courier Prime", monospace; letter-spacing: .1em; color: var(--text-2); }

  .card { border: 1px solid var(--line-strong); border-radius: 4px; }
  .card-h { padding: 11px 16px 9px; border-bottom: 1px solid var(--text); align-items: center; }
  .card-h h2 { font: 700 12px/1.2 "Courier Prime", monospace; letter-spacing: .07em; text-transform: uppercase; }
  .card-h .sub { font: 400 12.5px/1.2 "Courier Prime", monospace; color: var(--text-3); }
  .card-b { padding: 14px 16px 16px; }

  .pill { font: 700 11px/1.5 "Courier Prime", monospace; letter-spacing: .1em; text-transform: uppercase;
    border: 1.5px solid currentColor; border-radius: 3px; padding: 1px 7px 0 5px; background: transparent; }
  .st-running { background: var(--text); color: var(--surface); border-color: var(--text); }
  .st-external { color: var(--text); background: transparent; }
  .st-starting { color: var(--text-2); background: transparent; }
  .st-stopped, .st-none { color: var(--text-3); background: transparent; }
  .st-error { color: var(--bad); background: var(--bad-soft); }

  .switch .track { background: var(--line-strong); }
  .switch .track::after { background: var(--surface); box-shadow: 0 0 0 1px var(--line-strong), 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + .track { background: var(--text); }
  .switch input:checked + .track::after { box-shadow: none; }

  .btn { border-radius: 3px; border-color: var(--line-strong); color: var(--text); font-weight: 600; text-decoration: none; }
  .btn:hover { border-color: var(--text); }
  .btn.primary { background: var(--text); color: var(--surface); border-color: var(--text); }
  .btn.primary:hover { opacity: 1; background: var(--text-2); border-color: var(--text-2); }

  .kpi .label { font: 700 11px/1.2 "Courier Prime", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
  .kpi .value { font: 800 32px/1.1 "Archivo", sans-serif; font-stretch: 84%; letter-spacing: -.03em; margin-top: 6px; }
  .kpi .foot { font: 400 12px/1.3 "Courier Prime", monospace; }

  .input { border-radius: 3px; border-color: var(--line-strong); }
  .input:focus { border-color: var(--text); box-shadow: 0 0 0 3px var(--accent-soft); }
  .tabs { border-radius: 4px; }
  .tab { border-radius: 3px; }
  .tab.active { background: var(--text); color: var(--surface); box-shadow: none; }
  .op { font: 700 10.5px/1.6 "Courier Prime", monospace; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line-strong); background: transparent; border-radius: 3px; font-size: 11px; }
  .checks .ok .ic { background: var(--text); color: var(--surface); }
  .result { border-radius: 3px; }
  .result.ok { background: var(--surface-2); color: var(--text); }
  .result.err { background: var(--bad-soft); color: var(--bad); }
  .graph-frame, pre.logs, .toast, .preview, .hit { border-radius: 4px; }
  .prompt-box, .agent-note, .code-block pre, .seg button { border-radius: 3px; }
  .seg button.on { background: var(--text); border-color: var(--text); color: var(--surface); }
  .avatar { background: var(--text); color: var(--surface); }
  .icon-btn { border-radius: 3px; border-color: var(--line-strong); }
  .step-n { background: var(--text); color: var(--surface); }
  .score-bar i { background: var(--text); }
  .tip { border-radius: 3px; font-size: 12.5px; }
  .code-label { font: 700 11.5px/1.3 "Courier Prime", monospace; letter-spacing: .05em; text-transform: uppercase; }
  .agent-name, .svc-name { font-weight: 700; font-size: 15px; }

  /* ---------- sidebar plegable ---------- */
  .app { transition: grid-template-columns .18s ease; }
  .logo { position: relative; }
  .collapse-btn { width: 30px; padding: 0; margin-left: auto; flex: none; }
  .logo-name { min-width: 0; line-height: 1; }
  .logo-mark { display: flex; align-items: center; }
  @media (min-width: 761px) {
    body.side-min .app { grid-template-columns: 64px 1fr; }
    body.side-min nav.side { padding: 16px 8px; align-items: center; }
    body.side-min .logo { flex-direction: column; gap: 10px; padding: 4px 0 16px; }
    body.side-min .collapse-btn { margin-left: 0; }
    body.side-min .logo-name, body.side-min .nav-item span { display: none !important; }
    body.side-min .nav-item { width: 42px; height: 38px; justify-content: center; padding: 0; }
    body.side-min .side-foot { padding: 12px 0 0; width: 100%; justify-items: center; }
    body.side-min .side-tools { flex-direction: column; align-items: center; }
    body.side-min .info-wrap { margin-left: 0 !important; }
    body.side-min #lang-btn { padding: 0 4px; font-size: 10.5px; }
    body.side-min #lang-btn svg { display: none; }
  }

  /* ---------- ajustes ---------- */
  .nav-order { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .nav-order li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 3px; font-size: 14px; }
  .nav-order li.off { color: var(--text-3); }
  .nav-order li.off .nav-name { text-decoration: line-through; }
  .nav-order .ic { width: 18px; height: 18px; display: grid; place-items: center; }
  .nav-order .ic svg { width: 16px; height: 16px; }
  .nav-order .nav-name { flex: 1; min-width: 0; }
  .nav-order .mv { width: 28px; height: 28px; padding: 0; display: grid; place-items: center; }
  .nav-order .mv:disabled { opacity: .3; cursor: default; }
  .nav-order label.check { margin: 0; }
  /* hay una versión nueva: la notificación y el engranaje del sidebar en verde (pedido explícito, única
     excepción al monocromo junto con el rojo de errores) */
  :root { --update: #15803d; --update-soft: #e8f5ec; }
  :root[data-theme="dark"] { --update: #4ade80; --update-soft: #16271c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --update: #4ade80; --update-soft: #16271c; } }
  .update-note { border: 1.5px solid var(--update); background: var(--update-soft); color: var(--text); border-radius: 3px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
  .update-note b { color: var(--update); }
  .update-note code { font: 700 13px/1 "Courier Prime", monospace; }
  #settings-btn.has-update { color: var(--update); border-color: var(--update); background: var(--update-soft); position: relative; }
  #settings-btn.has-update::after { content: ""; position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--update); }
  #settings-btn.active { background: var(--text); color: var(--surface); border-color: var(--text); }
  /* ajustes: contexto por modelo */
  .ctx-modes { display: grid; gap: 8px; margin: 4px 0 14px; }
  .ctx-cap-row { display: flex; align-items: center; gap: 8px; padding-left: 26px; }
  .ctx-cap-row .input { width: 130px; flex: none; min-width: 0; padding: 6px 10px; }
  .ctx-cap-row .input:disabled { opacity: .45; }
  .ctx-wrap { overflow-x: auto; }
  .ctx-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .ctx-table th { text-align: left; font: 700 11px/1.2 "Courier Prime", monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3);
    padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
  .ctx-table td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .ctx-table td.mono { font-size: 12.5px; overflow-wrap: anywhere; }
  .ctx-table .input { width: 110px; min-width: 0; flex: none; padding: 5px 8px; font-family: "Courier Prime", monospace; font-size: 12.5px; }
  .ctx-table .eff { font: 700 12.5px/1 "Courier Prime", monospace; white-space: nowrap; }
  /* conexiones: login OAuth */
  .conn-auth { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 0 4px; padding: 8px 10px; border: 1px dashed var(--line-strong); border-radius: 3px; font-size: 13.5px; }
  .conn-auth span { flex: 1; min-width: 180px; }
  .conn.prop { border-style: dashed; }
  /* ajustes: backups */
  .backup-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
  .backup-list li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .bk-main { display: grid; gap: 2px; flex: 1; min-width: 200px; }
  .bk-main .mono { font-size: 12.5px; overflow-wrap: anywhere; }
  .bk-act { display: flex; gap: 6px; flex-wrap: wrap; }
  .bk-act .btn { padding: 4px 10px; font-size: 12.5px; }
  /* conocimiento: frescura de las fuentes */
  .src-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .src-wrap { overflow-x: auto; }
  .src-err { color: var(--bad); font-size: 12.5px; margin-top: 3px; }
  .fresh { font: 400 12.5px/1.3 "Courier Prime", monospace; white-space: nowrap; color: var(--text-2); }
  .fresh.old { color: var(--text); font-weight: 700; text-decoration: underline dotted; }
  .fresh.new { color: var(--text); }
  #sources .btn { padding: 4px 10px; font-size: 12.5px; }
  .stamp-ok { font-size: 12px; color: var(--text-2); align-self: center; margin-right: 4px; }
  /* servicios: el botón (i) del sidebar abre esta lista hacia arriba */
  .info-wrap { position: relative; display: inline-flex; }
  /* fixed y ubicada por JS (toggleInfo): así no la recorta el sidebar, esté plegado o en celular */
  .info-pop { position: fixed; z-index: 30; width: 220px; background: var(--surface); color: var(--text);
    border: 1px solid var(--line-strong); border-radius: 4px; box-shadow: 0 12px 32px -12px rgba(10,10,10,.3); padding: 10px 12px; display: grid; gap: 8px; }
  .info-pop .info-h { font: 700 11px/1.2 "Courier Prime", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  .info-pop .side-svc { font-size: 13px; }
  .info-pop .info-link { border: 0; background: none; padding: 6px 0 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer;
    font-size: 12.5px; color: var(--text-2); text-decoration: underline; text-underline-offset: 3px; }
  .info-pop .info-link:hover { color: var(--text); }
  #info-btn { position: relative; }
  #info-btn.has-err::after { content: ""; position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
  #info-btn[aria-expanded="true"] { background: var(--text); color: var(--surface); border-color: var(--text); }
  .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
  .color-row { display: flex; align-items: center; gap: 10px; font-size: 13.5px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .color-row input[type=color] { width: 34px; height: 26px; padding: 0 2px; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--surface); cursor: pointer; flex: none; }
  .color-row .mono { margin-left: auto; font-size: 12px; color: var(--text-3); }
  /* actualizar y reiniciar: el botón verde junto a "Buscar actualizaciones" (misma excepción al monocromo) */
  .update-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .update-row .btn[hidden] { display: none; }
  .btn.update-go { background: var(--update); color: #fff; border-color: var(--update); }
  :root[data-theme="dark"] .btn.update-go { color: #0a0a0a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.update-go { color: #0a0a0a; } }
  .btn.update-go:hover { filter: brightness(1.08); }
  .btn.update-go:disabled { opacity: .6; cursor: progress; }
  .updating { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(10,10,10,.45); padding: 16px; }
  .updating > div { background: var(--surface); color: var(--text); border: 1.5px solid var(--update); border-radius: 4px; padding: 20px 22px; max-width: 420px; display: grid; gap: 8px; }
  .updating b { color: var(--update); font-size: 16px; }
  /* ajustes: contexto fijo de la app y notificaciones */
  .app-ctx { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .app-ctx summary { cursor: pointer; font-size: 13.5px; font-weight: 600; }
  .app-ctx summary .muted { font-weight: 400; font-size: 12.5px; }
  .app-ctx-text { white-space: pre-wrap; font-size: 12px; line-height: 1.45; max-height: 280px; overflow: auto; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; margin: 8px 0 0; }
  .notify-kinds { display: grid; gap: 8px; margin: 10px 0 0 26px; }
  .notify-kinds.off { opacity: .45; }
  /* conectar agente: acceso remoto por URL */
  .remote-card .card-b { display: grid; gap: 12px; }
  .remote-top { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; }
  .remote-top h2 { margin: 0 0 4px; font-size: 16px; }
  .remote-top p { margin: 0; font-size: 13.5px; color: var(--text-2); max-width: 70ch; }
  .remote-state { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--text-2); }
  .remote-url .code-block { margin-bottom: 4px; }
  .remote-url pre { overflow-wrap: anywhere; white-space: pre-wrap; }
  .remote-warn { font-size: 12.5px; color: var(--text-2); border-left: 3px solid var(--text); padding: 4px 0 4px 10px; }
  .remote-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .remote-adv summary { cursor: pointer; font-size: 13.5px; font-weight: 600; }
  .remote-adv .form-grid { display: grid; gap: 10px; margin-top: 10px; }
  .remote-adv .input { width: 100%; }
  .agent-steps { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--text-2); display: grid; gap: 3px; }
  .manual-form { grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-bottom: 14px; }
  .manual-form > div { min-width: 0; }
  #log-tabs { max-width: 100%; overflow-x: auto; }
  @media (max-width: 760px) { .remote-top { flex-direction: column; } .manual-form { grid-template-columns: 1fr; } }
  /* "Sobre mí" automático */
  .auto-about { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 8px; }
  .auto-about-h { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13.5px; }
  .auto-about-h .muted { font-size: 12px; }
  .auto-about-text { font-size: 13.5px; color: var(--text-2); white-space: pre-wrap; }
  .auto-about-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  /* Fact check */
  .fc-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  .fc-main, .fc-side { min-width: 0; }
  .fc-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 10px; }
  .fc-prefs { display: grid; gap: 8px; min-width: 0; }
  .fc-prefs .input, .fc-prefs .bui-dd-btn, #fc-form .input { min-width: 0; }
  .fc-label { display: block; font: 700 11px/1.3 "Courier Prime", monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin-top: 4px; }
  .fc-help { font-size: 12px; color: var(--text-3); margin: 0; }
  .fc-dates { display: flex; gap: 8px; } .fc-dates .input { min-width: 0; }
  .fc-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .fc-two .input { min-width: 0; }
  .fc-adv summary { cursor: pointer; font-size: 13.5px; font-weight: 600; margin-top: 4px; }
  .fc-adv-b { display: grid; gap: 8px; margin-top: 10px; }
  .fc-checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .fc-sp { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: 13px; }
  .fc-steps { margin: 12px 0 0; padding-left: 20px; font-size: 13px; color: var(--text-2); display: grid; gap: 3px; }
  .fc-steps li.now { color: var(--text); font-weight: 600; }
  .fc-hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .fc-hist li { display: grid; grid-template-columns: minmax(0, 1fr); border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .fc-hist li:last-child { border-bottom: 0; }
  .fc-hist button.link { min-width: 0; text-align: left; background: none; border: 0; padding: 6px 0; cursor: pointer; color: var(--text); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fc-hist .when { font-size: 11.5px; color: var(--text-3); }
  .fc-rep { margin-top: 16px; display: grid; gap: 16px; }
  .fc-banner { border-left: 3px solid var(--text); padding: 6px 0 6px 12px; font-size: 13px; color: var(--text-2); }
  .fc-banner.warn { border-color: var(--bad); color: var(--text); }
  .fc-claim h3 { margin: 0; font-size: 15px; line-height: 1.4; }
  .fc-v { display: inline-flex; align-items: center; gap: 6px; font: 700 11.5px/1 "Courier Prime", monospace; text-transform: uppercase; letter-spacing: .05em; padding: 5px 10px; border-radius: 999px; border: 1.5px solid var(--text); margin: 10px 0 6px; }
  .fc-v.supported { background: var(--text); color: var(--surface); }
  .fc-v.false, .fc-v.likely_false { border-color: var(--bad); color: var(--bad); }
  .fc-v.false { background: var(--bad); color: #fff; }
  .fc-v.inconclusive, .fc-v.unverifiable, .fc-v.skipped { border-style: dashed; color: var(--text-2); }
  .fc-meta { font-size: 12.5px; color: var(--text-3); margin: 4px 0; }
  .fc-claim p { margin: 6px 0; font-size: 13.5px; color: var(--text-2); }
  .fc-group-h { font: 700 11px/1.3 "Courier Prime", monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin: 14px 0 6px; }
  .fc-src { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
  .fc-src a { color: var(--text); font-weight: 600; overflow-wrap: anywhere; }
  .fc-src .tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0; }
  .fc-tag { font-size: 11px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 1px 7px; color: var(--text-2); }
  .fc-tag.bad { border-color: var(--bad); color: var(--bad); }
  .fc-src blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--line-strong); color: var(--text-2); }
  .fc-src .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .fc-src .acts .btn { padding: 4px 9px; font-size: 12px; }
  .fc-lims { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--text-2); }
  @media (max-width: 1100px) { .fc-grid { grid-template-columns: 1fr; } }
  /* cambios en el grafo pendientes de aprobación */
  #gp-panel { display: grid; gap: 12px; margin-bottom: 14px; }
  .gp-card { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 14px; align-items: start; }
  .gp-card img { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .gp-card ul { margin: 6px 0; padding-left: 18px; font-size: 13px; }
  .gp-card .add { color: #1a7f37; } .gp-card .rm { color: var(--bad); }
  @media (max-width: 760px) { .gp-card { grid-template-columns: 1fr; } .fc-two { grid-template-columns: 1fr; } }
  @media (max-width: 760px) {
    .color-grid { grid-template-columns: 1fr; }
    .collapse-btn { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <div class="logo">
      <div class="logo-mark"><svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="3" y="7" width="26" height="18" rx="2" fill="var(--surface)" stroke="currentColor" stroke-width="2.2"/><path d="M3 12.5h26" stroke="currentColor" stroke-width="2.2"/><path d="M8 17.5h10M8 21h7" stroke="currentColor" stroke-width="1.8"/></svg></div>
      <div class="logo-name">brain</div>
      <button class="icon-btn collapse-btn" id="collapse-btn" type="button"></button>
    </div>
    <button class="nav-item" data-view="panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span data-i18n="nav.panel"></span></button>
    <button class="nav-item" data-view="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span data-i18n="nav.chat"></span></button>
    <button class="nav-item" data-view="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-i18n="nav.profile"></span></button>
    <button class="nav-item" data-view="agentes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0V7zM12 16v5"/></svg><span data-i18n="nav.agents"></span></button>
    <button class="nav-item" data-view="conexiones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span data-i18n="nav.connections"></span></button>
    <button class="nav-item" data-view="grafo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M7.3 11 16.8 6.2M7.3 13l9.5 4.8"/></svg><span data-i18n="nav.graph"></span></button>
    <button class="nav-item" data-view="conocimiento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span data-i18n="nav.knowledge"></span></button>
    <button class="nav-item" data-view="factcheck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v5c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10V6l-8-3z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg><span data-i18n="nav.factcheck"></span></button>
    <button class="nav-item" data-view="logs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg><span data-i18n="nav.logs"></span></button>
    <div class="side-foot">
      <div class="side-tools">
        <button class="icon-btn" id="theme-btn"></button>
        <button class="icon-btn" id="lang-btn"></button>
        <div class="info-wrap" style="margin-left:auto">
          <button class="icon-btn" id="info-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="side-svcs"></button>
          <div class="info-pop" id="side-svcs" role="region" hidden></div>
        </div>
        <button class="icon-btn" id="settings-btn"></button>
      </div>
    </div>
  </nav>

  <main>
    <!-- PANEL -->
    <section class="view" id="view-panel">
      <header class="page">
        <div><h1 data-i18n="panel.title"></h1><p data-i18n="panel.sub"></p></div>
        <div class="updated"><span class="pulse"></span><span id="updated"></span></div>
      </header>
      <div class="section-title" data-i18n="panel.services"></div>
      <div class="grid services" id="services"></div>
      <div class="section-title" data-i18n="panel.content"></div>
      <div class="grid kpis" id="kpis"></div>
      <div class="section-title" data-i18n="panel.stats"></div>
      <div class="grid charts">
        <div class="card chart wide">
          <div class="card-h"><h2 data-i18n="chart.activity"></h2><span class="sub" id="activity-sub"></span></div>
          <div class="card-b"><div id="chart-activity"></div>
            <button class="table-toggle" id="table-toggle"></button><div id="table-activity"></div></div>
        </div>
        <div class="card chart">
          <div class="card-h"><h2 data-i18n="chart.domains"></h2><span class="sub">top 8</span></div>
          <div class="card-b"><div id="chart-domains"></div></div>
        </div>
        <div class="card chart">
          <div class="card-h"><h2 data-i18n="chart.ops"></h2><span class="sub" data-i18n="chart.opsSub"></span></div>
          <div class="card-b"><div id="chart-ops"></div></div>
        </div>
      </div>
      <div class="grid two" style="margin-top:16px">
        <div class="card"><div class="card-h"><h2 data-i18n="health.title"></h2><span class="sub" id="health-sub"></span></div>
          <div class="card-b"><ul class="checks" id="health"></ul></div></div>
        <div class="card"><div class="card-h"><h2 data-i18n="recent.title"></h2><span class="sub" data-i18n="recent.sub"></span></div>
          <div class="card-b"><ul class="commits" id="commits"></ul></div></div>
      </div>
    </section>

    <!-- CHAT -->
    <section class="view" id="view-chat">
      <iframe class="chat-frame" id="chat-iframe"></iframe>
    </section>

    <!-- PERFIL -->
    <section class="view" id="view-perfil">
      <header class="page"><div><h1 data-i18n="profile.title"></h1><p data-i18n="profile.sub"></p></div></header>
      <div class="grid two">
        <div class="grid" style="align-content:start">
          <div class="card"><div class="card-h"><h2 data-i18n="profile.about"></h2><span class="sub">profile.md</span></div>
            <div class="card-b">
              <div class="profile-head"><div class="avatar" id="avatar">?</div><div><div class="n" id="p-name-view"></div><div class="h" id="p-head-view"></div></div></div>
              <form id="profile-form">
                <div class="field"><label for="p-name" data-i18n="profile.name"></label><input class="input full" id="p-name" autocomplete="off"></div>
                <div class="field"><label for="p-headline" data-i18n="profile.headline"></label><input class="input full" id="p-headline" autocomplete="off"></div>
                <div class="field"><label for="p-about" data-i18n="profile.aboutField"></label><textarea class="input" id="p-about"></textarea></div>
                <button class="btn primary" type="submit" id="p-save" data-i18n="profile.save"></button>
              </form>
              <div class="result" id="profile-result"></div>
              <div class="auto-about" id="auto-about">
                <div class="auto-about-h"><b data-i18n="profile.autoTitle"></b><span class="muted" id="auto-about-when"></span></div>
                <div class="auto-about-text" id="auto-about-text"></div>
                <div class="auto-about-row">
                  <label class="check"><input type="checkbox" id="auto-about-on"> <span data-i18n="profile.autoOn"></span></label>
                  <button class="btn" type="button" id="auto-about-refresh" data-i18n="profile.autoRefresh"></button>
                </div>
                <p class="form-hint" style="margin:6px 0 0" data-i18n="profile.autoHint"></p>
              </div>
            </div></div>
          <div class="card"><div class="card-h"><h2 data-i18n="mem.yours"></h2><span class="sub" id="mem-sub"></span></div>
            <div class="card-b">
              <input class="input full" id="mem-filter" style="margin-bottom:8px">
              <div class="mem-list" id="mem-list"></div>
            </div></div>
          <div class="card"><div class="card-h"><h2 data-i18n="reflect.title"></h2><span class="sub" data-i18n="reflect.sub"></span></div>
            <div class="card-b">
              <p class="form-hint" data-i18n="reflect.hint" style="margin-top:0"></p>
              <button class="btn" type="button" id="reflect-btn" data-i18n="reflect.run"></button>
              <div class="result" id="reflect-result"></div>
              <div id="reflect-list" class="reflect-list"></div>
            </div></div>
        </div>
        <div class="card" style="align-self:start"><div class="card-h"><h2 data-i18n="mem.import"></h2><span class="sub" data-i18n="mem.importSub"></span></div>
          <div class="card-b steps">
            <div><div class="step-t"><span class="step-n">1</span><span data-i18n="mem.step1"></span></div>
              <div class="seg" id="mem-source"></div></div>
            <div><div class="step-t"><span class="step-n">2</span><span id="step2-t"></span></div>
              <div class="prompt-box" id="mem-prompt"></div>
              <div class="prompt-actions"><button class="btn" id="copy-prompt" type="button"></button><span class="sub muted" id="copy-ok"></span></div></div>
            <div><div class="step-t"><span class="step-n">3</span><span data-i18n="mem.step3"></span></div>
              <textarea class="input" id="mem-text" style="min-height:140px"></textarea>
              <div class="prompt-actions">
                <button class="btn primary" id="mem-preview-btn" type="button" data-i18n="mem.preview"></button>
                <label class="btn file-btn"><span data-i18n="mem.upload"></span><input type="file" id="mem-file" accept=".txt,.md,.json,text/plain,application/json"></label>
              </div>
              <div class="result" id="mem-result"></div>
              <div id="mem-preview"></div>
            </div>
          </div></div>
      </div>
    </section>

    <!-- CONECTAR AGENTE -->
    <section class="view" id="view-agentes">
      <header class="page"><div><h1 data-i18n="agents.title"></h1><p data-i18n="agents.sub"></p></div></header>
      <div class="tabs" id="agent-tabs">
        <button class="tab active" data-tab="connect" data-i18n="agents.tabConnect"></button>
        <button class="tab" data-tab="mine"><span data-i18n="agents.tabMine"></span><span class="count" id="agents-count">0</span></button>
      </div>
      <div id="agents-connect">
        <div class="section-title" data-i18n="agents.desktop"></div>
        <div class="grid agents" id="agents-desktop"></div>
        <div class="section-title" data-i18n="agents.others"></div>
        <div class="grid agents" id="agents-other"></div>
        <div class="section-title" id="remote-section" data-i18n="agents.remoteSection"></div>
        <div class="card remote-card" id="remote-card"></div>
        <div class="card" style="margin-top:16px"><div class="card-h"><h2 data-i18n="agents.manualTitle"></h2><span class="sub" data-i18n="agents.manualSub"></span></div>
          <div class="card-b"><p class="muted" style="margin:0 0 10px;font-size:13px" data-i18n="agents.manualText"></p><div id="agents-manual"></div></div></div>
      </div>
      <div id="agents-mine" hidden>
        <div class="card"><div class="card-b" id="agents-list"></div></div>
        <div class="card" style="margin-top:16px"><div class="card-h"><h2 data-i18n="agents.addManualTitle"></h2><span class="sub" data-i18n="agents.addManualSub"></span></div>
          <div class="card-b">
            <p class="muted" style="margin:0 0 10px;font-size:13px" data-i18n="agents.addManualText"></p>
            <form id="client-add-form" class="form-row" autocomplete="off">
              <input class="input" id="client-add-name" required maxlength="80">
              <button class="btn primary" type="submit" data-i18n="agents.addManualBtn"></button>
            </form>
          </div></div>
      </div>
    </section>

    <!-- CONEXIONES -->
    <section class="view" id="view-conexiones">
      <header class="page"><div><h1 data-i18n="conn.title"></h1><p data-i18n="conn.sub"></p></div></header>
      <div class="grid two" style="align-items:start">
        <div class="grid" style="align-content:start">
          <div class="card"><div class="card-h"><h2 data-i18n="conn.yours"></h2><span class="sub" id="conn-count"></span></div>
            <div class="card-b"><div class="conns-list" id="conns"></div></div></div>
        </div>
        <div class="grid" style="align-content:start">
          <div class="card" id="conn-form-card"><div class="card-h"><h2 id="conn-form-title"></h2><span class="sub" data-i18n="conn.formSub"></span></div>
            <div class="card-b">
              <div class="seg" id="conn-kind" style="margin-bottom:14px">
                <button type="button" data-kind="stdio" class="on" data-i18n="conn.kindStdio"></button>
                <button type="button" data-kind="http" data-i18n="conn.kindHttp"></button>
              </div>
              <form id="conn-form" class="form-grid" autocomplete="off">
                <div class="field"><label for="cf-name" data-i18n="conn.fName"></label><input class="input full" id="cf-name" placeholder="gmail" required></div>
                <div class="field kind-stdio"><label for="cf-cmd" data-i18n="conn.fCmd"></label><input class="input full mono" id="cf-cmd" placeholder="npx"></div>
                <div class="field kind-http full" hidden><label for="cf-url" data-i18n="conn.fUrl"></label><input class="input full mono" id="cf-url" placeholder="https://mcp.example.com/mcp"></div>
                <div class="field kind-stdio"><label for="cf-args" data-i18n="conn.fArgs"></label><textarea class="input mono" id="cf-args" placeholder="-y&#10;@modelcontextprotocol/server-github"></textarea></div>
                <div class="field kind-stdio"><label for="cf-env" data-i18n="conn.fEnv"></label><textarea class="input mono" id="cf-env" placeholder="GITHUB_TOKEN=…"></textarea></div>
                <div class="field kind-http full" hidden><label for="cf-headers" data-i18n="conn.fHeaders"></label><textarea class="input mono" id="cf-headers" placeholder="Authorization: Bearer …"></textarea></div>
                <p class="form-hint full" id="cf-hint" data-i18n="conn.secretHint"></p>
                <div class="full" style="display:flex;gap:8px;align-items:center">
                  <button class="btn primary" type="submit" id="cf-save" data-i18n="conn.save"></button>
                  <button class="btn" type="button" id="cf-cancel" hidden data-i18n="conn.cancel"></button>
                </div>
              </form>
              <div class="result" id="conn-result"></div>
            </div></div>
          <div class="card"><div class="card-h"><h2>Composio</h2><span class="sub" data-i18n="conn.optional"></span></div>
            <div class="card-b">
              <div class="notice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg><span data-i18n="conn.composioNote"></span></div>
              <form id="cmp-form" class="form-grid" style="margin-top:14px" autocomplete="off">
                <div class="field"><label for="cmp-key" data-i18n="conn.cKey"></label><input class="input full mono" id="cmp-key" type="password"></div>
                <div class="field"><label for="cmp-user" data-i18n="conn.cUser"></label><input class="input full mono" id="cmp-user" placeholder="me"></div>
                <p class="form-hint full" data-i18n="conn.cKeyHint"></p>
                <div class="full" style="display:flex;gap:8px;flex-wrap:wrap">
                  <button class="btn primary" type="submit" data-i18n="conn.cSave"></button>
                  <button class="btn" type="button" id="cmp-load" data-i18n="conn.cLoad"></button>
                  <button class="btn" type="button" id="cmp-off" hidden style="color:var(--bad)" data-i18n="conn.cOff"></button>
                </div>
              </form>
              <div id="cmp-apps"></div>
              <div class="result" id="cmp-result"></div>
            </div></div>
        </div>
      </div>
    </section>

    <!-- GRAFO -->
    <section class="view" id="view-grafo">
      <header class="page"><div><h1 data-i18n="graph.title"></h1><p data-i18n="graph.sub"></p></div></header>
      <div id="gp-panel" hidden></div>
      <div class="graph-frame"><iframe id="graph-iframe"></iframe></div>
    </section>

    <!-- CONOCIMIENTO -->
    <section class="view" id="view-conocimiento">
      <header class="page"><div><h1 data-i18n="know.title"></h1><p data-i18n="know.sub"></p></div></header>
      <div class="grid two">
        <div class="card"><div class="card-h"><h2 data-i18n="know.save"></h2><span class="sub" data-i18n="know.saveSub"></span></div>
          <div class="card-b">
            <form id="save-form" class="form-row">
              <input class="input" id="save-url" type="url" placeholder="https://…" required>
              <button class="btn primary" id="save-btn" type="submit" data-i18n="know.saveBtn"></button>
            </form>
            <label class="check" style="margin-top:10px"><input type="checkbox" id="save-js"> <span data-i18n="know.forceJs"></span></label>
            <div class="result" id="save-result"></div>
          </div></div>
        <div class="card"><div class="card-h"><h2 data-i18n="know.search"></h2><span class="sub" data-i18n="know.searchSub"></span></div>
          <div class="card-b">
            <form id="search-form" class="form-row">
              <input class="input" id="search-q" required>
              <button class="btn primary" id="search-btn" type="submit" data-i18n="know.searchBtn"></button>
            </form>
            <div class="result" id="search-result"></div>
            <div class="hits" id="hits"></div>
            <button class="btn" type="button" id="reindex-btn" data-i18n="know.reindex" style="margin-top:12px"></button>
            <div class="result" id="reindex-result"></div>
          </div></div>
      </div>
      <div class="card" style="margin-top:16px"><div class="card-h"><h2 data-i18n="know.sources"></h2><span class="sub" id="sources-sub"></span></div>
        <div class="card-b">
          <div class="src-bar"><button class="btn" type="button" id="refresh-all" data-i18n="know.refreshAll"></button><span class="muted mono" id="refresh-all-st"></span></div>
          <div id="sources"></div>
        </div></div>
    </section>

    <!-- FACT CHECK -->
    <section class="view" id="view-factcheck">
      <header class="page"><div><h1 data-i18n="fc.title"></h1><p data-i18n="fc.sub"></p></div></header>
      <div class="fc-grid">
        <div class="fc-main">
          <div class="card"><div class="card-h"><h2 data-i18n="fc.verify"></h2><span class="sub" data-i18n="fc.verifySub"></span></div>
            <div class="card-b">
              <form id="fc-form">
                <textarea class="input full" id="fc-text" rows="4" maxlength="4000" required></textarea>

  $("#client-add-name").placeholder = T.agents.addManualPh;
  renderTools();
}
function setLang(l) {
  lang = l; T = I18N[l];

function toggleInfo(open) {

// arriba del botón y alineada con el sidebar; plegado, a la derecha del botón; en celular, abajo
function placeInfo() {
  const pop = $("#side-svcs"), r = $("#info-btn").getBoundingClientRect(), side = $("nav.side").getBoundingClientRect();
  const mobile = matchMedia("(max-width: 760px)").matches, w = pop.offsetWidth, h = pop.offsetHeight;
  let left, top;
  if (mobile) { left = r.right - w; top = r.bottom + 8; }
  else if (document.body.classList.contains("side-min")) { left = side.right + 8; top = r.bottom - h; }
  else { left = side.left + 14; top = r.top - h - 8; }
  pop.style.left = Math.max(8, Math.min(left, innerWidth - w - 8)) + "px";
  pop.style.top = Math.max(8, top) + "px";
}

// ================= ajustes: backup y restauración (brain_mcp/backup.py) =================
const fmtSize = n => n >= 1 << 30 ? `${(n / (1 << 30)).toFixed(1)} GB` : n >= 1 << 20 ? `${(n / (1 << 20)).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`;
async function loadBackups() {
  let r; try { r = await api("/api/backup/list"); } catch (e) { return; }
  const S = T.settings;
  $("#backup-list").innerHTML = (r.backups || []).map(b => {
    const m = b.manifest || {};
    return `<li><div class="bk-main"><span class="mono">${esc(b.name)}</span>
      <span class="muted">${esc(m.created_at ? ago(m.created_at) : "")} · ${esc(fmtSize(b.size))} · ${esc(S.backupFiles(m.files || 0))}${m.includes_secrets ? ` · <b>${esc(S.backupWithSecrets)}</b>` : ""}</span></div>
      <div class="bk-act"><a class="btn" href="/api/backup/download?name=${encodeURIComponent(b.name)}" download>${esc(S.backupDownload)}</a>
      <button class="btn" type="button" data-bk-restore="${esc(b.name)}">${esc(S.backupRestore)}</button>
      <button class="btn" type="button" data-bk-del="${esc(b.name)}" style="color:var(--bad)">${esc(S.backupDelete)}</button></div></li>`;
  }).join("") || `<li class="muted">${esc(S.backupNone)}</li>`;
  $("#backup-list").querySelectorAll("[data-bk-restore]").forEach(b => b.onclick = () => restoreBackup(b.dataset.bkRestore));
  $("#backup-list").querySelectorAll("[data-bk-del]").forEach(b => b.onclick = async () => {
    if (!(await ask(S.backupDelConfirm(b.dataset.bkDel), { ok: T.dlg.del, danger: true }))) return;
    try { await api("/api/backup/delete", { name: b.dataset.bkDel }); } catch (e) { toast(e.message); }
    loadBackups();
  });
}
async function restoreBackup(name) {
  const S = T.settings, out = $("#backup-result");
  if (!(await ask(S.backupRestoreConfirm(name), { ok: S.backupRestore, danger: true }))) return;
  showResult(out, "info", S.backupRestoring, true);
  try {
    const r = await api("/api/backup/restore", { name });
    if (!r.ok) return showResult(out, "err", `${T.err.other} ${r.detail || r.code}`);
    const rb = r.rebuild || {};
    showResult(out, "ok", S.backupRestored(r.files, r.safety_backup) + (rb.chroma_error ? ` ${S.backupNoChroma}` : ""));
    statsSig = ""; loadBackups();
  } catch (e) { showResult(out, "err", e.message); }
}
$("#backup-create").onclick = async () => {
  const S = T.settings, out = $("#backup-result"), btn = $("#backup-create");
  btn.disabled = true; showResult(out, "info", S.backupCreating, true);
  try {
    const r = await api("/api/backup/create", { include_secrets: $("#backup-secrets").checked });
    if (!r.ok) return showResult(out, "err", r.detail || r.code);
    const ch = r.manifest.chroma || {};

    loadBackups();

};

// ================= ajustes: contexto por modelo =================
// Se guarda en el server (data/chat_settings.json) porque lo usa chat.py al pedirle num_ctx a Ollama.
let ctxData = null;
const kTok = n => !n ? "—" : n >= 1024 ? `${Math.round(n / 1024)}k` : String(n);
async function loadContext() {
  let r; try { r = await api("/api/chat/context"); } catch (e) { r = { ok: false, detail: e.message }; }
  if (!r.ok) return showResult($("#ctx-result"), "err", r.detail || T.err.other);
  ctxData = r; renderContext();
}
function renderContext() {
  const st = ctxData.settings, S = T.settings;
  document.querySelectorAll('input[name="ctx-mode"]').forEach(x => x.checked = x.value === st.mode);
  const cap = $("#ctx-cap"); cap.value = st.cap; cap.min = ctxData.min; cap.max = ctxData.max;
  cap.setAttribute("aria-label", S.ctxCap);
  $("#ctx-table").innerHTML = ctxData.models.length ? `<tr><th>${esc(S.ctxModel)}</th><th>${esc(S.ctxModelMax)}</th><th>${esc(S.ctxUses)}</th><th>${esc(S.ctxOwn)}</th></tr>` +
    ctxData.models.map(m => `<tr><td class="mono">${esc(m.name.replace(/:latest$/, ""))}</td><td class="mono">${esc(kTok(m.ctx_max))}</td>
      <td class="eff" data-eff="${esc(m.name)}"></td>
      <td><input class="input ctx-own" type="number" step="1024" min="${ctxData.min}" max="${ctxData.max}" data-model="${esc(m.name)}"
        value="${st.models[m.name] || ""}" placeholder="${esc(S.ctxOwnPh)}" aria-label="${esc(S.ctxOwn)} · ${esc(m.name)}"></td></tr>`).join("") : "";
  $("#ctx-note").textContent = !ctxData.ollama ? S.ctxNoOllama : !ctxData.models.length ? S.ctxNoModels : "";
  updateCtx();
}
function readCtx() {
  const mode = (document.querySelector('input[name="ctx-mode"]:checked') || {}).value || "cap";
  const models = { ...(ctxData ? ctxData.settings.models : {}) };  // conserva los de modelos que hoy no están instalados
  document.querySelectorAll(".ctx-own").forEach(i => { const v = parseInt(i.value, 10); if (v > 0) models[i.dataset.model] = v; else delete models[i.dataset.model]; });
  return { mode, cap: parseInt($("#ctx-cap").value, 10) || 0, models };
}
function effCtx(m, f) {
  const mx = m.ctx_max || 0, own = f.models[m.name];
  if (own) return mx ? Math.min(own, mx) : own;
  return f.mode === "max" ? (mx || 4096) : Math.min(mx || 4096, f.cap || 4096);
}
function updateCtx() {
  if (!ctxData) return;
  const f = readCtx();
  $("#ctx-cap").disabled = f.mode === "max";
  $("#ctx-cap-k").textContent = f.cap ? `= ${kTok(f.cap)}` : "";
  let big = false;
  ctxData.models.forEach(m => { const e = effCtx(m, f); big = big || e > 32768; const td = document.querySelector(`[data-eff="${CSS.escape(m.name)}"]`); if (td) td.textContent = kTok(e); });
  if (ctxData.ollama && ctxData.models.length) $("#ctx-note").textContent = big ? T.settings.ctxRam : "";
}
$("#ctx-card").addEventListener("input", updateCtx);
$("#ctx-card").addEventListener("change", updateCtx);
async function saveCtx(body) {
  const out = $("#ctx-result");
  try {
    const r = await api("/api/chat/context", body);
    if (!r.ok) return showResult(out, "err", r.code === "bad_ctx" ? T.settings.ctxBad(ctxData.min, ctxData.max) : (r.detail || T.err.other));
    ctxData = r; renderContext(); showResult(out, "ok", T.settings.ctxSaved);
    try { localStorage.setItem("brain-ctx-changed", String(Date.now())); } catch (e) {}  // el chat recarga sus modelos
  } catch (e) { showResult(out, "err", e.message); }
}
$("#ctx-save").onclick = () => saveCtx(readCtx());
$("#ctx-reset").onclick = () => saveCtx({ mode: "cap", cap: ctxData ? ctxData.default_cap : 16384, models: {} });
