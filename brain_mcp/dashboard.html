<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #f6f5f2; --surface: #fcfcfb; --surface-2: #f0efec; --line: #e6e4df; --line-strong: #d6d3cc;
    --text: #0b0b0b; --text-2: #52514e; --text-3: #8a8780;
    --accent: #2a78d6; --accent-soft: #e4effc; --accent-ink: #1c5cab;
    --bar: #2a78d6; --bar-hover: #1c5cab; --grid: #ebe9e4;
    --good: #0f8a4f; --good-soft: #e3f4ea; --warn: #b87400; --warn-soft: #fbf0d9;
    --bad: #cf3b3a; --bad-soft: #fbe6e5; --idle: #8a8780; --idle-soft: #efeee9;
    --shadow: 0 1px 2px rgba(20,20,15,.04), 0 2px 8px rgba(20,20,15,.04);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #2a2a28; --line-strong: #3a3936;
      --text: #ffffff; --text-2: #c3c2b7; --text-3: #85837b;
      --accent: #3987e5; --accent-soft: #1c2a3d; --accent-ink: #86b6ef;
      --bar: #3987e5; --bar-hover: #86b6ef; --grid: #262624;
      --good: #3fbf7f; --good-soft: #15291e; --warn: #e0a83a; --warn-soft: #2e2413;
      --bad: #ee6b6a; --bad-soft: #321a1a; --idle: #85837b; --idle-soft: #242422;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.2);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #2a2a28; --line-strong: #3a3936;
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #85837b;
    --accent: #3987e5; --accent-soft: #1c2a3d; --accent-ink: #86b6ef;
    --bar: #3987e5; --bar-hover: #86b6ef; --grid: #262624;
    --good: #3fbf7f; --good-soft: #15291e; --warn: #e0a83a; --warn-soft: #2e2413;
    --bad: #ee6b6a; --bad-soft: #321a1a; --idle: #85837b; --idle-soft: #242422;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.2);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
  button, input { font: inherit; color: inherit; }
  a { color: var(--accent); text-decoration: none; }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  nav.side { position: sticky; top: 0; height: 100vh; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px;
    border-right: 1px solid var(--line); background: var(--surface); }
  .logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; font-weight: 700; font-size: 16px; letter-spacing: -.02em; }
  .logo-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--text); color: var(--surface); display: grid; place-items: center; }
  .logo small { display: block; font-weight: 500; font-size: 11.5px; color: var(--text-3); letter-spacing: 0; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--text-2);
    cursor: pointer; font-weight: 500; border: 0; background: none; text-align: left; width: 100%; }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent-ink); }
  .nav-item svg { width: 17px; height: 17px; flex: none; }
  .side-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line); display: grid; gap: 7px; }
  .side-svc { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); }
  .side-svc .dot { width: 7px; height: 7px; border-radius: 50%; }

  main { padding: 28px 36px 60px; min-width: 0; }
  header.page { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  header.page h1 { margin: 0; font-size: 24px; letter-spacing: -.025em; font-weight: 650; }
  header.page p { margin: 2px 0 0; color: var(--text-3); font-size: 13px; }
  .updated { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 50%, transparent); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  section.view { display: none; }
  section.view.active { display: block; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 16px 18px 0; }
  .card-h h2 { margin: 0; font-size: 13.5px; font-weight: 600; letter-spacing: -.005em; }
  .card-h .sub { font-size: 12px; color: var(--text-3); }
  .card-b { padding: 14px 18px 18px; }
  .grid { display: grid; gap: 16px; }
  .section-title { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin: 28px 0 10px; }
  .section-title:first-child { margin-top: 0; }

  /* ---------- servicios ---------- */
  .services { grid-template-columns: repeat(3, 1fr); }
  .svc { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .svc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .svc-name { font-weight: 600; font-size: 14.5px; }
  .svc-desc { color: var(--text-3); font-size: 12.5px; margin-top: 1px; }
  .svc-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--text-3); }
  .svc-actions { display: flex; gap: 8px; margin-top: auto; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px 2px 6px; border-radius: 999px; }
  .pill svg { width: 12px; height: 12px; }
  .st-running { color: var(--good); background: var(--good-soft); }
  .st-external { color: var(--accent-ink); background: var(--accent-soft); }
  .st-starting { color: var(--warn); background: var(--warn-soft); }
  .st-stopped { color: var(--idle); background: var(--idle-soft); }
  .st-error { color: var(--bad); background: var(--bad-soft); }

  .switch { position: relative; width: 40px; height: 23px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
  .switch input:disabled { cursor: not-allowed; }
  .switch .track { position: absolute; inset: 0; border-radius: 999px; background: var(--line-strong); transition: background .18s; }
  .switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .18s cubic-bezier(.3,.7,.4,1); }
  .switch input:checked + .track { background: var(--good); }
  .switch input:checked + .track::after { transform: translateX(17px); }
  .switch input:disabled + .track { opacity: .55; }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .switch.busy .track::after { animation: blink .8s infinite alternate; }
  @keyframes blink { to { opacity: .4; } }

  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
    padding: 6px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 500; cursor: pointer; color: var(--text-2); }
  .btn:hover { border-color: var(--line-strong); color: var(--text); }
  .btn.primary { background: var(--text); color: var(--surface); border-color: var(--text); }
  .btn.primary:hover { opacity: .88; }
  .btn:disabled { opacity: .5; cursor: progress; }
  .btn svg { width: 14px; height: 14px; }

  /* ---------- KPIs ---------- */
  .kpis { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
  .kpi { padding: 14px 16px; }
  .kpi .label { font-size: 12px; color: var(--text-3); font-weight: 500; }
  .kpi .value { font-size: 26px; font-weight: 650; letter-spacing: -.03em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .value.na { color: var(--text-3); font-size: 20px; }
  .kpi .foot { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }

  /* ---------- charts ---------- */
  .charts { grid-template-columns: 2fr 1fr; }
  .charts .wide { grid-column: 1 / -1; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart .axis text { font-size: 11px; fill: var(--text-3); font-variant-numeric: tabular-nums; }
  .chart .grid-line { stroke: var(--grid); stroke-width: 1; }
  .chart .baseline { stroke: var(--line-strong); stroke-width: 1; }
  .chart .bar { fill: var(--bar); transition: fill .12s; }
  .chart .bar.hi { fill: var(--bar-hover); }
  .chart .hbar-label { font-size: 12.5px; fill: var(--text-2); }
  .chart .hbar-value { font-size: 12px; fill: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .chart .track { fill: var(--surface-2); }
  .empty-chart { height: 150px; display: grid; place-items: center; color: var(--text-3); font-size: 13px; text-align: center; padding: 0 20px; }
  .tip { position: fixed; pointer-events: none; z-index: 50; background: var(--text); color: var(--surface); font-size: 12px;
    padding: 6px 9px; border-radius: 7px; opacity: 0; transform: translate(-50%, calc(-100% - 10px)); transition: opacity .1s; white-space: nowrap; }
  .tip b { font-weight: 650; }
  .table-toggle { font-size: 12px; color: var(--text-3); background: none; border: 0; cursor: pointer; padding: 0; }
  .table-toggle:hover { color: var(--text); }
  table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 10px; }
  table.data th { text-align: left; color: var(--text-3); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.data td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.data tr:last-child td { border-bottom: 0; }

  /* ---------- salud y actividad ---------- */
  .two { grid-template-columns: 1fr 1fr; }
  .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .checks li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .checks li:last-child { border-bottom: 0; }
  .checks .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .checks .ic svg { width: 12px; height: 12px; }
  .checks .ok .ic { background: var(--good-soft); color: var(--good); }
  .checks .no .ic { background: var(--bad-soft); color: var(--bad); }
  .checks .lbl { font-weight: 500; }
  .checks .state { margin-left: auto; font-size: 12px; color: var(--text-3); text-align: right; }
  .checks .no .state { color: var(--bad); }
  .commits { list-style: none; margin: 0; padding: 0; }
  .commits li { display: grid; grid-template-columns: 76px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .commits li:last-child { border-bottom: 0; }
  .op { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 5px; text-align: center; background: var(--surface-2); color: var(--text-2); }
  .commits .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .commits .when { color: var(--text-3); font-size: 11.5px; white-space: nowrap; }
  .muted { color: var(--text-3); }

  /* ---------- grafo ---------- */
  .graph-frame { width: 100%; height: calc(100vh - 150px); min-height: 480px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
  .graph-frame iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* ---------- conocimiento ---------- */
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .input { flex: 1; min-width: 220px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; outline: none; }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .check { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-2); cursor: pointer; user-select: none; }
  .check input { accent-color: var(--accent); }
  .result { margin-top: 12px; padding: 10px 12px; border-radius: 9px; font-size: 13px; display: none; align-items: flex-start; gap: 8px; }
  .result.show { display: flex; }
  .result.ok { background: var(--good-soft); color: var(--good); }
  .result.err { background: var(--bad-soft); color: var(--bad); }
  .result.info { background: var(--surface-2); color: var(--text-2); }
  .result svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }
  .hits { display: grid; gap: 10px; margin-top: 14px; }
  .hit { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .hit-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 12px; color: var(--text-3); }
  .score { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; color: var(--text-2); font-weight: 600; }
  .score-bar { width: 60px; height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .score-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .hit p { margin: 0; font-size: 13px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- logs ---------- */
  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 10px; width: fit-content; margin-bottom: 12px; }
  .tab { border: 0; background: none; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-weight: 500; font-size: 13px; color: var(--text-2); display: inline-flex; align-items: center; gap: 7px; }
  .tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; }
  pre.logs { margin: 0; height: calc(100vh - 220px); min-height: 360px; overflow: auto; padding: 16px 18px; font-size: 12px; line-height: 1.6;
    background: #111110; color: #d9d8d2; border-radius: var(--radius); border: 1px solid var(--line); white-space: pre-wrap; word-break: break-all; }
  pre.logs .cmd { color: #86b6ef; }
  pre.logs .end { color: #e0a83a; }

  .toast { position: fixed; bottom: 20px; right: 20px; z-index: 60; background: var(--text); color: var(--surface); padding: 10px 14px;
    border-radius: 10px; font-size: 13px; max-width: 420px; box-shadow: 0 6px 24px rgba(0,0,0,.2); opacity: 0; transform: translateY(8px); transition: .2s; }
  .toast.show { opacity: 1; transform: none; }

  @media (max-width: 1100px) { .services { grid-template-columns: 1fr 1fr; } .charts, .two { grid-template-columns: 1fr; } }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    nav.side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; }
    .logo { padding: 0 8px 0 0; width: 100%; }
    .nav-item { width: auto; }
    .side-foot { display: none; }
    main { padding: 20px 16px 40px; }
    .services { grid-template-columns: 1fr; }
  }

  /* ---------- sidebar: ajustes (tema + idioma) ---------- */
  .side-tools { display: flex; gap: 6px; margin-top: 8px; }
  .icon-btn { height: 30px; min-width: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
    color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }
  .icon-btn:hover { color: var(--text); border-color: var(--line-strong); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .icon-btn svg { width: 15px; height: 15px; }

  /* ---------- perfil ---------- */
  .field { display: grid; gap: 5px; margin-bottom: 12px; }
  .field label { font-size: 12.5px; font-weight: 500; color: var(--text-2); }
  textarea.input { min-height: 110px; resize: vertical; line-height: 1.5; font: inherit; width: 100%; }
  .input.full { width: 100%; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 650; font-size: 16px; flex: none; }
  .profile-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .profile-head .n { font-weight: 600; font-size: 15px; }
  .profile-head .h { color: var(--text-3); font-size: 12.5px; }
  .steps { display: grid; gap: 18px; }
  .step-t { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; margin-bottom: 8px; }
  .step-n { width: 20px; height: 20px; border-radius: 50%; background: var(--text); color: var(--surface); font-size: 11px; display: grid; place-items: center; flex: none; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer;
    font-size: 12.5px; font-weight: 500; color: var(--text-2); }
  .seg button.on { background: var(--text); color: var(--surface); border-color: var(--text); }
  .prompt-box { position: relative; background: var(--surface-2); border-radius: 9px; padding: 12px 14px; font-size: 12.5px;
    color: var(--text-2); white-space: pre-wrap; line-height: 1.55; max-height: 160px; overflow: auto; }
  .prompt-actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .file-btn { position: relative; overflow: hidden; }
  .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .preview { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; }
  .preview-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .preview-b { max-height: 320px; overflow: auto; padding: 4px 12px 10px; }
  .mem-cat { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .mem-cat:last-child { border-bottom: 0; }
  .mem-cat-h { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .count { font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); }
  .src { font-size: 11px; color: var(--text-3); font-weight: 500; }
  .mem-items { list-style: none; margin: 0; padding: 0; }
  .mem-items li { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; font-size: 13px; color: var(--text-2); }
  .mem-items li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--memory, #0f8f9c); margin-top: 8px; flex: none; }
  .mem-items li span { flex: 1; }
  .x-btn { border: 0; background: none; color: var(--text-3); cursor: pointer; padding: 2px 4px; border-radius: 5px; line-height: 1; font-size: 15px; }
  .x-btn:hover { color: var(--bad); background: var(--bad-soft); }
  .mem-list { max-height: 560px; overflow: auto; }
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <div class="logo">
      <div class="logo-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="10" cy="18" r="2.5"/><path d="M8.3 6.6 15.6 7.6M16.6 10.1 11.5 16M7.1 8.3 9.2 15.6"/></svg></div>
      <div>brain<small data-i18n="tagline"></small></div>

async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-Brain": "1" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
function toast(msg) {

}

  if (location.hash !== `#${v}`) history.replaceState(null, "", `#${v}`);

function uptime(s) {
  if (s == null) return "";
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)} min`;
  return `${Math.floor(s / 3600)} h ${Math.floor((s % 3600) / 60)} min`;
}
function renderServices() {

    const meta = [T.port(s.port)];
    if (s.uptime != null) meta.push(T.since(uptime(s.uptime)));

const tip = $("#tip");
function showTip(e, html) { tip.innerHTML = html; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.style.opacity = 1; }
function hideTip() { tip.style.opacity = 0; }
// barra con extremo de datos redondeado (4px) y apoyada en la línea base
function vbar(x, y, w, h, r = 4) {
  if (h <= 0) return "";
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function hbar(x, y, w, h, r = 4) {
  if (w <= 0) return "";
  r = Math.min(r, h / 2, w);
  return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
}
// máximo "redondo" y par, así la línea del medio también es un entero (son conteos)
function niceMax(v) { if (v <= 4) return 4; const p = 10 ** Math.floor(Math.log10(v)); const m = [1, 2, 4, 6, 8, 10].find(m => m * p >= v); return m * p; }
const dayFmt = () => new Intl.DateTimeFormat(locale(), { day: "numeric", month: "short" });
const parseDay = d => { const [y, m, dd] = d.split("-").map(Number); return new Date(y, m - 1, dd); };
let tableOpen = false;

function activityChart(el, data) {
  const total = data.reduce((a, d) => a + d.count, 0);
  $("#activity-sub").textContent = T.chart.changes(fmt(total));
  const W = Math.max(320, el.clientWidth || 700), H = 190, L = 28, R = 6, TOP = 10, B = 24;
  const max = niceMax(Math.max(1, ...data.map(d => d.count)));
  const iw = W - L - R, ih = H - TOP - B, step = iw / data.length, bw = Math.max(3, Math.min(18, step - 2));
  const df = dayFmt();
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T.chart.aria)}">`;
  s += `<g class="axis">${[0, max / 2, max].map(v => { const y = TOP + ih - (v / max) * ih; return `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 3.5}" text-anchor="end">${fmt(v)}</text>`; }).join("")}</g>`;
  data.forEach((d, i) => {
    const x = L + i * step + (step - bw) / 2, h = (d.count / max) * ih;
    s += `<path class="bar" data-i="${i}" d="${vbar(x, TOP + ih - h, bw, h)}"/>`;
    s += `<rect data-i="${i}" x="${L + i * step}" y="${TOP}" width="${step}" height="${ih}" fill="transparent"/>`;
    if (i % 7 === (data.length - 1) % 7) s += `<text x="${L + i * step + step / 2}" y="${H - 6}" text-anchor="middle" style="font-size:11px;fill:var(--text-3)">${df.format(parseDay(d.day))}</text>`;
  });
  s += `<line class="baseline" x1="${L}" x2="${W - R}" y1="${TOP + ih}" y2="${TOP + ih}"/></svg>`;
  el.innerHTML = s;
  el.querySelectorAll("rect[data-i]").forEach(r => {
    const i = +r.dataset.i, bar = el.querySelector(`path[data-i="${i}"]`);
    r.onmousemove = e => { bar && bar.classList.add("hi"); const d = data[i];
      showTip(e, `${df.format(parseDay(d.day))} · <b>${fmt(d.count)}</b> ${T.chart.change(d.count)}`); };
    r.onmouseleave = () => { bar && bar.classList.remove("hi"); hideTip(); };
  });
  $("#table-activity").innerHTML = tableOpen
    ? `<table class="data"><thead><tr><th>${T.chart.day}</th><th class="num">${T.chart.count}</th></tr></thead><tbody>${data.filter(d => d.count).reverse()
        .map(d => `<tr><td>${df.format(parseDay(d.day))}</td><td class="num">${fmt(d.count)}</td></tr>`).join("") || `<tr><td colspan="2" class="muted">${T.chart.noChanges}</td></tr>`}</tbody></table>` : "";
}
function barList(el, data, emptyMsg, unit) {
  if (!data.length || data.every(d => !d.value)) { el.innerHTML = `<div class="empty-chart">${emptyMsg}</div>`; return; }
  const W = Math.max(260, el.clientWidth || 320), row = 30, labelW = Math.min(150, W * 0.42), valW = 34;
  const H = data.length * row, max = Math.max(...data.map(d => d.value)), bw = W - labelW - valW;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  data.forEach((d, i) => {
    const y = i * row + 8, h = 14, w = Math.max(d.value ? 3 : 0, (d.value / max) * bw);
    const label = d.label.length > 22 ? d.label.slice(0, 21) + "…" : d.label;
    s += `<text class="hbar-label" x="0" y="${y + 11}">${esc(label)}</text>`;
    s += `<rect class="track" x="${labelW}" y="${y}" width="${bw}" height="${h}" rx="4"/>`;
    s += `<path class="bar" data-i="${i}" d="${hbar(labelW, y, w, h)}"/>`;
    s += `<text class="hbar-value" x="${W}" y="${y + 11}" text-anchor="end">${fmt(d.value)}</text>`;
    s += `<rect data-i="${i}" x="0" y="${i * row}" width="${W}" height="${row}" fill="transparent"/>`;
  });
  el.innerHTML = s + "</svg>";
  el.querySelectorAll("rect[data-i]").forEach(r => {
    const i = +r.dataset.i, bar = el.querySelector(`path[data-i="${i}"]`);
    r.onmousemove = e => { bar && bar.classList.add("hi"); showTip(e, `${esc(data[i].label)} · <b>${fmt(data[i].value)}</b> ${unit}`); };
    r.onmouseleave = () => { bar && bar.classList.remove("hi"); hideTip(); };
  });
}
$("#table-toggle").onclick = () => {
  tableOpen = !tableOpen;
  $("#table-toggle").textContent = tableOpen ? T.chart.hideTable : T.chart.table;
  if (stats) activityChart($("#chart-activity"), stats.activity);
};

function ago(iso) {

  const s = (new Date(iso) - Date.now()) / 1000, a = Math.abs(s);
  if (a < 60) return rel.format(Math.round(s), "second");
  if (a < 3600) return rel.format(Math.round(s / 60), "minute");
  if (a < 86400) return rel.format(Math.round(s / 3600), "hour");

}

};
$("#mem-file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $("#mem-text").value = await f.text(); e.target.value = "";
  $("#mem-preview-btn").click();
};
$("#mem-preview-btn").onclick = async () => {
  const out = $("#mem-result");
  try {
    const r = await api("/api/memory/parse", { text: $("#mem-text").value });
    memPreview = r.categories;
    if (!memPreview.length) { memPreview = null; $("#mem-preview").innerHTML = ""; showResult(out, "err", T.mem.nothing); return; }
    out.className = "result"; renderPreview();
  } catch (e) { showResult(out, "err", e.message); }
};
function renderPreview() {
  const n = memPreview.reduce((a, c) => a + c.items.length, 0);
  $("#mem-preview").innerHTML = `<div class="preview"><div class="preview-h"><strong style="font-size:13px">${esc(T.mem.found(fmt(n), fmt(memPreview.length)))}</strong>
    <button class="btn primary" id="mem-import-btn" type="button">${esc(T.mem.importBtn(fmt(n)))}</button></div>
    <div class="preview-b">${memPreview.map((c, ci) => `<div class="mem-cat"><div class="mem-cat-h">${esc(c.category)}<span class="count">${fmt(c.items.length)}</span></div>
      <ul class="mem-items">${c.items.map((i, ii) => `<li><span>${esc(i)}</span><button class="x-btn" data-c="${ci}" data-i="${ii}" title="${esc(T.mem.del)}" aria-label="${esc(T.mem.del)}">×</button></li>`).join("")}</ul></div>`).join("")}</div></div>`;
  // sacar ítems de la previsualización antes de importar
  $("#mem-preview").querySelectorAll(".x-btn").forEach(b => b.onclick = () => {
    memPreview[+b.dataset.c].items.splice(+b.dataset.i, 1);
    memPreview = memPreview.filter(c => c.items.length);
    if (memPreview.length) renderPreview(); else { memPreview = null; $("#mem-preview").innerHTML = ""; }
  });
  $("#mem-import-btn").onclick = async () => {
    const btn = $("#mem-import-btn"); btn.disabled = true;
    try {
      const r = await api("/api/memory/import", { source: memSource, categories: memPreview });
      showResult($("#mem-result"), r.added ? "ok" : "info", r.added ? T.mem.imported(fmt(r.added), r.files.length) : T.mem.noneNew);
      memPreview = null; $("#mem-preview").innerHTML = ""; $("#mem-text").value = "";
      statsSig = ""; loadProfile();
    } catch (e) { showResult($("#mem-result"), "err", e.message); btn.disabled = false; }
  };
}

// ================= conocimiento =================
$("#save-form").onsubmit = async e => {
  e.preventDefault();
  const btn = $("#save-btn"), out = $("#save-result");
  btn.disabled = true;
  showResult(out, "info", T.know.working, true);
  try {
    const r = await api("/api/save_url", { url: $("#save-url").value, render_js: $("#save-js").checked });
    if (r.ok) { showResult(out, "ok", T.know.saved(r)); $("#save-url").value = ""; statsSig = ""; loadStats(); }
    else showResult(out, "err", errText(r));
  } catch (e2) { showResult(out, "err", e2.message); }
  finally { btn.disabled = false; }
};
$("#search-form").onsubmit = async e => {
  e.preventDefault();
  const btn = $("#search-btn"), out = $("#search-result"), hits = $("#hits");
  btn.disabled = true; hits.innerHTML = "";
  showResult(out, "info", T.know.searching, true);
  try {
    const r = await api("/api/search", { query: $("#search-q").value, top_k: 6 });
    if (!r.ok) showResult(out, "err", errText(r));
    else if (!r.hits.length) showResult(out, "info", T.know.noHits);
    else {
      out.className = "result";
      hits.innerHTML = r.hits.map(h => `<div class="hit"><div class="hit-top">
        <span class="score"><span class="score-bar"><i style="width:${Math.max(0, Math.min(1, h.score)) * 100}%"></i></span>${(h.score * 100).toFixed(0)}%</span>
        <a href="${esc(h.url)}" target="_blank" rel="noopener" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(h.url)}</a></div>
        <p>${esc(h.text)}</p></div>`).join("");
    }
  } catch (e2) { showResult(out, "err", e2.message); }
  finally { btn.disabled = false; }
};

// ================= logs =================
let logSvc = "chroma", logSig = "";
function renderLogTabs() {
  if (!status) return;
  $("#log-tabs").innerHTML = status.services.map(s =>
    `<button class="tab ${s.key === logSvc ? "active" : ""}" data-k="${esc(s.key)}"><span class="dot" style="background:${STATUS_COLOR[s.status]}"></span>${esc(svcLabel(s))}</button>`).join("");
  $("#log-tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => { logSvc = b.dataset.k; logSig = ""; renderLogTabs(); loadLogs(); });
}
async function loadLogs() {
  renderLogTabs();
  try {
    const { lines } = await api(`/api/logs/${logSvc}`);
    const sig = lang + lines.length + (lines[lines.length - 1] || "");
    if (sig === logSig) return;
    logSig = sig;
    const box = $("#log-box"), atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    const svc = status && status.services.find(s => s.key === logSvc);
    box.innerHTML = lines.length ? lines.map(l => {
      const c = l.startsWith("$ ") ? "cmd" : l.startsWith("[proceso terminado") ? "end" : "";
      return c ? `<span class="${c}">${esc(l)}</span>` : esc(l);
    }).join("\n") : esc(svc && svc.status === "external" ? T.logs.external(svcLabel(svc)) : T.logs.empty);
    if (atBottom) box.scrollTop = box.scrollHeight;
  } catch (e) { /* reintenta */ }
}

// ================= arranque =================
applyStatic();
renderMemSource();
$("#updated").textContent = T.connecting;
go(location.hash.slice(1) || "panel");
loadStatus(); loadStats();
setInterval(loadStatus, 2500);
setInterval(() => { if (view === "panel" || view === "conocimiento") loadStats(); }, 5000);
setInterval(() => { if (view === "logs") loadLogs(); }, 1500);
</script>
