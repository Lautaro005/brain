<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>brain</title>
<link rel="stylesheet" href="notch.css">
</head>
<body>
  <div class="island seed" id="island">
    <header id="head">
      <div class="who">
        <span class="live" id="live" aria-hidden="true"></span>
        <b>brain</b>
        <em id="sub"></em>
      </div>
      <div class="gap" aria-hidden="true"></div>
      <button type="button" id="bell" aria-label="Notifications">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2a5.2 5.2 0 0 0-5.2 5.2v2.4c0 .7-.3 1.4-.8 1.9L4.6 14.4c-.5.6-.1 1.6.7 1.6h13.4c.8 0 1.2-1 .7-1.6l-1.4-1.7c-.5-.5-.8-1.2-.8-1.9V8.4A5.2 5.2 0 0 0 12 3.2z"/><path d="M10 17.6a2 2 0 0 0 4 0"/></svg>
        <i id="count" hidden></i>
      </button>
    </header>
    <div class="body">
      <div id="alert" class="alert" role="button" tabindex="0">
        <ul id="list"></ul>
        <svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div id="stage" class="stage">
        <svg id="svg" role="img"></svg>
        <p id="tip"></p>
      </div>
    </div>
  </div>
<script src="notch.js"></script>
</body>
</html>
