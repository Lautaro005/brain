<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>brain</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <h1 id="title">brain could not start</h1>
  <p id="msg"></p>
  <div class="cmd" id="cmds">

  </div>
  <p id="logs">Details are in <code>~/.brain/data/logs/app.log</code>.</p>

</main>
