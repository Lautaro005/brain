[package]
name = "brain-desktop"
description = "brain desktop app: tray icon, system notifications and notch panel around the brain dashboard"
version = "0.3.3-6"
edition = "2021"
license-file = "../../../LICENSE"
repository = "https://github.com/Lautaro005/brain"
publish = false

[lib]
name = "brain_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "brain-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
